  if (!email) return w;
  var st = rows_('Staff').filter(function (r) { return low_(r.email) === email && !/^(no|n|false)$/i.test(str_(r.active)); })[0];
  w.hubEligible = email === owner_() || !!st || hubOpen_() || hubNoPw_(email);
  var open = hubUnlocked_(email);          // the coordinator hub is password protected: staff powers only after unlocking it
  if (open && (email === owner_() || (st && /admin/i.test(st.role)))) { w.roles.push('admin'); w.campuses = { S: 'edit', N: 'edit' }; w.name = st ? str_(st.name) : ''; }
  else if (open && !st && (hubOpen_() || hubNoPw_(email))) { w.roles.push('coordinator'); w.campuses = { S: 'edit', N: 'edit' }; }
  else if (open && st) {
    w.roles.push(/proctor/i.test(st.role) ? 'proctor' : 'coordinator'); w.name = str_(st.name);
    var home = /^n/i.test(st.campus) ? 'N' : 'S', other = home === 'N' ? 'S' : 'N';

  }

  if (t) { w.roles.push('teacher'); w.tid = str_(t.tid); w.name = w.name || str_(t.name); }
  var s = rows_('Students').filter(function (r) { return low_(r.email) === email && /^active$/i.test(str_(r.status) || 'active'); })[0] || studentByPattern_(email);
  if (s) { w.roles.push('student'); w.sid = str_(s.sid); w.name = w.name || studentName_(s); w.campus = str_(s.campus) === 'N' ? 'N' : 'S'; }

// Student accounts are the first 3 letters of the last name + the student ID (smi513421@…); teachers are first initial + last name
// (jsmith@…). Used only to recognize who signed in when the sheet has no email for them (never to send email). Google has already
// confirmed the account; the pattern must point to exactly one person.
function studentByPattern_(email) {
  var m = /^([a-z]{1,3})(\d{3,})@(.+)$/.exec(email); if (!m || m[3] !== domain_()) return null;
  var hit = rows_('Students').filter(function (r) { return /^active$/i.test(str_(r.status) || 'active') && String(str_(r.sid)).replace(/^0+/, '') === m[2].replace(/^0+/, '') && low_(r.last).replace(/[^a-z]/g, '').slice(0, 3) === m[1]; });
  return hit.length === 1 ? hit[0] : null;
}
function teacherByPattern_(email) {

  var hit = rows_('Teachers').filter(function (r) { var p = low_(r.name).replace(/[^a-z\s-]/g, '').split(/\s+/).filter(String); return p.length > 1 && p[0].charAt(0) === m[1] && p[p.length - 1].replace(/[^a-z]/g, '') === m[2].replace(/[^a-z]/g, ''); });
  return hit.length === 1 ? hit[0] : null;
}

// ---------- the coordinator hub password (stored only as a salted SHA-256 hash in script properties; unlocks last 6 hours)
var HUB_BYPASS_ = false;          // sheet-menu functions and tests run without the web page's password step
function hubOpen_() { return yes_(setting_('Coordinator hub: anyone with the password', 'S')); }
function hubHash_(pw, salt) { try { return Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + '|' + pw, Utilities.Charset.UTF_8)); } catch (e) { return hash_(salt + '|' + pw) + hash_(pw + '|' + salt); } }
function hubPw_() { return json_(PropertiesService.getScriptProperties().getProperty('hubPw'), null); }
function hubNoPw_(email) { return !!email && list_(setting_('Coordinator hub: no password needed for', 'S')).map(low_).indexOf(low_(email)) >= 0; }
function hubUnlocked_(email) { return HUB_BYPASS_ || hubNoPw_(email) || (!!email && CacheService.getScriptCache().get('hub:' + email) === '1'); }
function api_hubUnlock(pw) {

  if (tries >= 5) throw new Error('Too many tries. Wait 15 minutes and try again.');
  var p = hubPw_(); if (!p) throw new Error('No hub password has been set yet. The administrator sets one first.');
  if (hubHash_(String(pw || ''), p.salt) !== p.hash) { c.put('hubtry:' + email, String(tries + 1), 900); throw new Error('That password isn’t right.'); }
  c.remove('hubtry:' + email); c.put('hub:' + email, '1', 21600); MEMO_ = {};

}
function api_hubLock() { CacheService.getScriptCache().remove('hub:' + myEmail_()); MEMO_ = {}; return api_boot(); }
function api_hubSetPassword(pw, old) {          // the sheet's owner sets it the first time; after that, the old password is needed
  var email = myEmail_(), p = hubPw_();

  if (p && hubHash_(String(old || ''), p.salt) !== p.hash) throw new Error('The current password isn’t right.');
  pw = String(pw || ''); if (pw.length < 8) throw new Error('Use at least 8 characters.');
  var salt = Utilities.getUuid(); PropertiesService.getScriptProperties().setProperty('hubPw', JSON.stringify({ salt: salt, hash: hubHash_(pw, salt), at: iso_() }));
  CacheService.getScriptCache().put('hub:' + email, '1', 21600); MEMO_ = {};

}
function verifiedSrc_(v) { return !/suggest/i.test(str_(v)) && !!str_(v); }          // a guessed address is not a sign-in or an email destination
function isStaff_(w) { return w.roles.indexOf('admin') >= 0 || w.roles.indexOf('coordinator') >= 0 || w.roles.indexOf('proctor') >= 0; }

function setupSheet() {
  Object.keys(TABLES).forEach(function (name) {          // every tab, and any missing header added at the end (nothing moved or removed)
    var sh = sheet_(name), w = Math.max(sh.getLastColumn(), 1), head = sh.getRange(1, 1, 1, w).getValues()[0].map(str_);
    TABLES[name].forEach(function (c) { if (head.indexOf(c[1]) < 0) { var at = head.filter(String).length + 1; sh.getRange(1, at).setValue(c[1]); head[at - 1] = c[1]; } });
  });
  if (!ss_().getSheetByName(IC_TAB)) { var ic = ss_().insertSheet(IC_TAB); ic.getRange(1, 1, ic.getMaxRows(), ic.getMaxColumns()).setNumberFormat('@'); }
  MEMO_ = {};
  var have = rows_('Settings').map(function (r) { return r.key; }), add = DEFAULTS.filter(function (d) { return have.indexOf(d[0]) < 0; });
  insertMany_('Settings', add.map(function (d) { return { key: d[0], S: d[1], N: d[2], help: d[3] }; }));
  if (!PropertiesService.getDocumentProperties().getProperty('cutoff0')) {          // 0.10: no 24-hour rule; booking is open until the period starts
    rows_('Settings').forEach(function (r) { if (r.key === 'Book at least this many hours ahead') { var d = DEFAULTS.filter(function (x) { return x[0] === r.key; })[0]; update_('Settings', r, { S: str_(r.S) === '24' ? '0' : r.S, N: str_(r.N) === '24' ? '0' : r.N, help: d[3] }); } });
    PropertiesService.getDocumentProperties().setProperty('cutoff0', '1');
  }
  if (!rows_('Testing Periods').length) insertMany_('Testing Periods', samplePeriods_());
  if (!rows_('Bell Schedules').length) insertMany_('Bell Schedules', sampleBells_());
  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === 'tick' || t.getHandlerFunction() === 'morning') ScriptApp.deleteTrigger(t); });
  ScriptApp.newTrigger('tick').timeBased().everyMinutes(10).create();          // expires waitlist offers and passes the seat on
  ScriptApp.newTrigger('morning').timeBased().everyDays(1).atHour(6).create();          // missing-material reminders for the next school day
  PropertiesService.getDocumentProperties().setProperty('setupVer', VERSION);
  return 'ok';
}

// Roster import (Infinite Campus CSV/Excel), the student/teacher directory, student schedules and their corrections,
// and the SignUpGenius appointment import. The page reads the file (CSV or Excel) and sends header + rows; nothing is
// applied until a preview has been looked at, and a full roster that would drop too many classes is held.

// ---------- course types: study hall, lunch and support count the same for Testing Center permission ("free")
function freeWords_() { return list_(setting_('Study hall / lunch / support names contain', 'S')).map(low_); }
function typeOf_(course, override) {          // 'study' | 'lunch' | 'support' | 'academic'
  var o = low_(override);
  if (/academic/.test(o)) return 'academic'; if (/lunch/.test(o)) return 'lunch'; if (/study/.test(o)) return 'study'; if (/support|free/.test(o)) return 'support';
  var c = low_(course), w = freeWords_().filter(function (x) { return x && c.indexOf(x) >= 0; })[0];
  if (!w) return 'academic';
  return /lunch/.test(w) ? 'lunch' : /study/.test(w) ? 'study' : 'support';
}
function isFree_(type) { return type === 'study' || type === 'lunch' || type === 'support'; }
// "SO Study A/Lunch B" → [{half:'A', name:'SO Study'}, {half:'B', name:'Lunch'}]; anything else → [{half:'', name}]
function halves_(course) {
  var m = /^(.+?)\s+A\s*\/\s*(.+?)\s+B$/i.exec(str_(course));
  return m ? [{ half: 'A', name: m[1] }, { half: 'B', name: m[2] }] : [{ half: '', name: str_(course) }];
}
function normPeriod_(v) {          // "Period 05", "5", "05A", "5(B)", "3rd" → { period: '5', half: 'A' | 'B' | '' }
  var s = str_(v), m = /(\d{1,2})\s*\(?\s*([AB])?\)?(?![\w])/i.exec(s.replace(/^(period|per\.?|pd\.?)\s*/i, ''));
  if (/before/i.test(s)) return { period: 'Before school', half: '' };
  if (/after/i.test(s)) return { period: 'After school', half: '' };
  return m ? { period: String(+m[1]), half: m[2] ? m[2].toUpperCase() : '' } : { period: s, half: '' };
}

// ---------- the directory: what one student's schedule is right now (district, or their own newer correction)
function sectionsById_() { if (MEMO_._sec) return MEMO_._sec; var o = {}; rows_('Sections').forEach(function (s) { o[str_(s.secid)] = s; }); return (MEMO_._sec = o); }
function teachersById_() { if (MEMO_._tch) return MEMO_._tch; var o = {}; rows_('Teachers').forEach(function (t) { o[str_(t.tid)] = t; }); return (MEMO_._tch = o); }
function secTeachers_(secid) {          // [{tid, name, email, verified, role}] primary first
  if (!MEMO_._st) { var by = {}; rows_('Section Teachers').forEach(function (r) { (by[str_(r.secid)] = by[str_(r.secid)] || []).push(r); }); MEMO_._st = by; }
  var T = teachersById_();
  return (MEMO_._st[str_(secid)] || []).map(function (r) { var t = T[str_(r.tid)] || {}; return { tid: str_(r.tid), name: str_(t.name), email: low_(t.email), verified: verifiedSrc_(t.esrc), contact: low_(t.contact), role: /co/i.test(r.role) ? 'co' : 'primary' }; })
    .sort(function (a, b) { return (a.role === 'primary' ? 0 : 1) - (b.role === 'primary' ? 0 : 1); });
}
// The district schedule on a date (default today): enrollments that are current then (not dropped; start ≤ date ≤ end when those are
// given), each class in every period it meets: a list ("8 · 7"), a start–end range (period 3 to 4), and every meeting pattern.
function officialSchedule_(sid, d) {
  d = d || today_();
  if (!MEMO_._enr) { var by = {}; rows_('Enrollments').forEach(function (e) { if (!/drop/i.test(e.status)) (by[str_(e.sid)] = by[str_(e.sid)] || []).push({ secid: str_(e.secid), start: day_(e.start), end: day_(e.end) }); }); MEMO_._enr = by; }
  var S = sectionsById_(), out = [], seen = {};
  (MEMO_._enr[str_(sid)] || []).forEach(function (e) {
    if ((e.start && e.start > d) || (e.end && e.end < d)) return;
    var s = S[e.secid]; if (!s || seen[e.secid]) return; seen[e.secid] = 1;
    var tch = secTeachers_(e.secid), pers = sectionPeriods_(s);
    pers.forEach(function (p) {
      halves_(s.course).forEach(function (h) {
        out.push({ period: p.period, half: h.half || p.half, course: h.half ? h.name : str_(s.course), secid: e.secid, cid: str_(s.cid), type: typeOf_(h.half ? h.name : s.course, h.half ? '' : s.type), raw: p.raw || '', room: str_(s.room),
          teachers: /lunch/i.test(h.name) && h.half ? [] : tch, teacher: /lunch/i.test(h.name) && h.half ? '' : tch.map(function (t) { return t.name; }).join(' / '), source: 'district' });
      });

  if (!pats || !pats.length) { var p = normPeriod_(s.period), q = normPeriod_(s.pend || s.period); pats = [{ list: p.period ? [p.period] : [], pe: q.period, half: p.half, raw: str_(s.period) }]; }
  pats.forEach(function (x) {
    var list = x.list || (x.p ? [x.p] : []);
    if (!list.length) { add('', '', x.raw); return; }
    list.forEach(function (p) { add(p, x.half || '', x.raw); });
    if (list.length === 1 && /^\d+$/.test(x.pe) && +x.pe > +list[0] && +x.pe - +list[0] < 4) for (var n = +list[0] + 1; n <= +x.pe; n++) add(String(n), '', x.raw);
  });
  return out;
}

}

function closeModal() { $('layer').innerHTML = ''; }
function uid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function dObj(d) { return new Date(d + 'T12:00:00'); }
function niceD(d) { if (!d) return ''; var x = dObj(d); return DAYS[x.getDay()] + ' ' + MONTHS[x.getMonth()] + ' ' + x.getDate(); }
function longD(d) { if (!d) return ''; var x = dObj(d); return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][x.getDay()] + ', ' + MONTHS[x.getMonth()] + ' ' + x.getDate(); }
function relD(d) { if (d === B.today) return 'Today'; var t = dObj(B.today); t.setDate(t.getDate() + 1); if (dObj(d).toDateString() === t.toDateString()) return 'Tomorrow'; return niceD(d); }
function hm(t) { if (!t) return ''; var p = t.split(':'), h = +p[0]; return (h % 12 || 12) + ':' + p[1] + (h < 12 ? ' AM' : ' PM'); }
function timeOf(iso) { if (!iso) return ''; var x = new Date(iso); return x.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function halfTxt(h) { return h === 'A' ? 'A half' : h === 'B' ? 'B half' : h === 'AB' ? 'Whole period' : ''; }
function perTxt(p, h) { return 'Period ' + p + (h && h !== '' ? ' · ' + halfTxt(h) : ''); }
function untilTxt(iso) { var m = Math.round((new Date(iso).getTime() - Date.now()) / 60000); if (m <= 0) return 'ending now'; if (m < 60) return m + ' min left'; return Math.floor(m / 60) + ' h ' + (m % 60) + ' min left'; }
function statusChip(s) { var c = /complete/i.test(s) && !/partial/i.test(s) ? 'ok' : /testing|checked/i.test(s) ? 'blue' : /no-show|cancel/i.test(s) ? 'bad' : /partial|paused/i.test(s) ? 'warn' : ''; return '<span class="chip ' + c + '">' + esc(s) + '</span>'; }
function readyChip(r) { if (!r) return ''; var c = r.state === 'Ready' ? 'ok' : r.state === 'Check' ? 'warn' : 'bad'; return '<span class="chip ' + c + '" title="' + esc(r.missing.join(', ')) + '">' + esc(r.state) + '</span>'; }
function fmtChip(r) { if (!r) return ''; var conf = /^teacher/.test(r.fsource); return r.format ? '<span class="chip ' + (conf ? 'info' : '') + '" title="' + esc(r.ftext) + '">' + (conf ? '' : '~ ') + esc(r.format) + '</span>' : '<span class="chip" title="' + esc(r.ftext) + '">?</span>'; }

// ---------- start
function boot() {
  call('api_boot').then(function (b) { B = b; drawModes(START.hub ? 'staff' : ''); }).catch(function (e) { $('main').innerHTML = '<div class="wrap narrow"><div class="card bad"><h2>Something went wrong</h2><p>' + esc(e.message || e) + '</p></div></div>'; });
}
// Which views this account gets: teachers open "My classes" (with a Student view), students their dashboard, coordinators the hub (password).
function drawModes(want) {
  var b = B;
  if (b.error === 'signin') { $('main').innerHTML = '<div class="wrap narrow"><div class="card"><h2>Please sign in</h2><p>Sign in with your school Google account, then reload this page.</p></div></div>'; return; }
  var modes = [];
  if (b.teacher) { modes.push(['teacher', 'My classes']); modes.push(['tview', 'Student view']); }
  if (b.student) modes.push(['student', 'My Testing Center']);
  if (b.staff || (b.hub && b.hub.eligible)) modes.push(['staff', (b.staff ? '' : '🔒 ') + 'Coordinator hub']);
  if (!modes.length) { $('main').innerHTML = '<div class="wrap narrow"><div class="card"><h2>We couldn’t find you</h2><p>You’re signed in as <b>' + esc(b.email) + '</b>, but that account isn’t on the Testing Center roster yet. If you’re a student, ask the Testing Center to check your school email. If you’re a teacher, your email may still need to be confirmed.</p></div></div>'; return; }
  var ids = modes.map(function (m) { return m[0]; });
  MODE = want && ids.indexOf(want) >= 0 ? want : START.appt && b.teacher ? 'teacher' : modes[0][0];
  $('modes').innerHTML = (modes.length > 1 ? '<div class="seg">' + modes.map(function (m) { return '<button id="mode-' + m[0] + '" onclick="setMode(\'' + m[0] + '\')">' + m[1] + '</button>'; }).join('') + '</div>' : '') + '<span class="mute small" style="margin-left:10px">' + esc(b.name || b.email) + '</span>';
  setMode(MODE);
}
function setMode(m) {
  MODE = m; [].forEach.call(document.querySelectorAll('#modes button'), function (x) { x.classList.toggle('on', x.id === 'mode-' + m); });
  if (m !== 'staff' && typeof clockStop === 'function') clockStop();
  if (m === 'student') stuStart(); else if (m === 'teacher') tchStart(); else if (m === 'tview') tvStart(); else if (B.staff) coStart(); else hubGate();
}
// ---------- the coordinator hub's password screen
function hubGate() {
  var h = B.hub || {}, out = '<div class="wrap narrow"><div class="card" style="max-width:440px;margin:40px auto"><h2>🔒 Coordinator hub</h2>';
  if (!h.hasPassword && h.owner) out += '<p class="small">Create the password coordinators will use to open the hub. Only its scrambled form is stored. You can change it later in Administration.</p><label class="f">New password (8 or more characters)</label><input type="password" id="hubNew"><label class="f">Type it again</label><input type="password" id="hubNew2"><button class="btn pri" style="margin-top:12px" id="hubGo">Create password and open</button>';
  else if (!h.hasPassword) out += '<p>The administrator hasn’t set a hub password yet.</p>';
  else out += '<p class="small mute">Enter the Testing Center hub password.</p><input type="password" id="hubPw" onkeydown="if(event.key===\'Enter\')$(\'hubGo\').click()"><button class="btn pri" style="margin-top:12px" id="hubGo">Open the hub</button><p class="tiny mute">It stays open on this account for 6 hours, or until you press Lock.</p>';
  $('main').innerHTML = out + '</div></div>';
  if ($('hubGo')) $('hubGo').onclick = function () {
    var btn = this, p;
    if ($('hubNew')) { if ($('hubNew').value !== $('hubNew2').value) return toast('The two passwords don’t match.'); p = call('api_hubSetPassword', $('hubNew').value, ''); }
    else p = call('api_hubUnlock', $('hubPw').value);
    busy(btn, true); p.then(function (b) { B = b; drawModes('staff'); }).catch(function (e) { busy(btn, false); fail(e); });
  };
  if ($('hubPw')) $('hubPw').focus();
}
function hubLock() { call('api_hubLock').then(function (b) { B = b; drawModes(''); toast('The hub is locked'); }).catch(fail); }
window.addEventListener('load', function () {
  if (google.script.url && google.script.url.getLocation) google.script.url.getLocation(function (loc) { START = loc.parameter || {}; boot(); });
  else boot();
});
</script>
<script>
// ---------- the student's page: My Testing Center, booking, the waitlist, and fixing their schedule
var SH = null, BK = null;          // SH = home data; BK = the booking in progress
function stuStart() { SH = B.student; drawStu(); }
function stuRefresh(h) { if (h) SH = h; drawStu(); }
function drawStu() {
  var h = SH, pv = !!h.preview, out = '<div class="wrap narrow">';
  if (pv) h = Object.assign({}, h, { booking: false, offers: [], askSchedule: false });
  if (pv) out += '<p><button class="link" onclick="tvStart()">← My students</button></p><div class="banner info small">You’re looking at <b>' + esc(h.me.name) + '</b>’s Testing Center page, as their teacher. Nothing can be booked or canceled here.</div>';
  out += '<h1>' + (pv ? esc(h.me.name.split(' ')[0]) + '’s Testing Center' : 'Hi, ' + esc(h.first) + '!') + '</h1><p class="mute" style="margin-top:0">' + esc(h.campusName) + ' Testing Center · ' + esc(h.where) + '</p>';
  h.offers.forEach(function (o) {
    out += '<div class="banner ok"><h3>🎉 A seat opened up for you</h3><p style="margin:4px 0 10px">' + esc(longD(o.date)) + ', ' + esc(perTxt(o.period, o.half)) + (o.test ? ' · ' + esc(o.test) : '') + '.<br><b>You are not booked yet.</b> Accept to take the seat, or decline so the next student can have it. <span class="mute">(' + untilTxt(o.expires) + ')</span></p>' +
      '<div class="row"><button class="btn ok" onclick="stuOffer(\'' + o.id + '\', true, this)">Accept</button><button class="btn" onclick="stuOffer(\'' + o.id + '\', false, this)">Decline</button></div></div>';
  });
  if (h.askSchedule && h.schedule.rows.length) out += '<div class="banner info"><b>Is your class schedule right?</b><div class="small mute" style="margin:2px 0 8px">We use it to fill in your classes and warn you about missing a class.</div><div class="row"><button class="btn sm" onclick="stuLooksRight(this)">My schedule looks correct</button><button class="btn sm" onclick="stuSchedule()">Edit my schedule</button><button class="btn sm" onclick="stuSchedule(true)">Paste my updated schedule from Infinite Campus</button></div></div>';
  out += '<div class="card" style="text-align:center;padding:22px">' + (pv ? '<span class="mute small">Students make and cancel appointments here.</span>' : h.booking ? '<button class="btn pri big" onclick="bkStart()">＋ Schedule a test</button>' : '<b>Sign up in SignUpGenius for now.</b><div class="mute small">The Testing Center is moving to this app soon.</div>') + '</div>';
  out += '<div class="card"><h2>Coming up</h2>' + (h.upcoming.length ? h.upcoming.map(function (a) {
    return '<div class="slot"><div class="grow"><b>' + esc(relD(a.date)) + ' · ' + esc(perTxt(a.period, a.half)) + '</b><div>' + esc(a.test) + ' <span class="mute">· ' + esc(a.course) + '</span></div><div class="small mute">' + esc(a.purpose) + (a.missed ? ' · You’ll miss ' + esc(a.missed) + ': bring a pass' : '') + '</div></div>' +
      (a.canCancel && !pv ? '<button class="btn sm bad" onclick="stuCancel(\'' + a.id + '\')">Cancel</button>' : statusChip(a.status)) + '</div>';
  }).join('') : '<div class="empty">No appointments yet.</div>') + '</div>';
  if (h.waits.length) out += '<div class="card"><h2>Waitlists</h2>' + h.waits.map(function (x) {
    return '<div class="slot"><div class="grow"><b>' + esc(relD(x.date)) + ' · ' + esc(perTxt(x.period, x.half)) + '</b><div class="small">' + esc(x.test) + ' · ' + esc(x.course) + '</div><div class="small mute">You’re <b>#' + x.pos + '</b> of ' + x.of + ' waiting. We’ll email you if a seat opens.</div></div>' + (pv ? '' : '<button class="btn sm" onclick="stuLeave(\'' + x.id + '\', this)">Leave</button>') + '</div>';
  }).join('') + '</div>';
  if (h.recent.length) out += '<div class="card"><h2>Recently finished</h2>' + h.recent.map(function (a) { return '<div class="slot"><div class="grow">' + esc(niceD(a.date)) + ' · ' + esc(a.test) + ' <span class="mute">· ' + esc(a.course) + '</span></div>' + statusChip(a.status) + '</div>'; }).join('') + '</div>';
  if (h.canceled.length) out += '<details class="card"><summary class="mute">Canceled (' + h.canceled.length + ')</summary>' + h.canceled.map(function (a) { return '<div class="small" style="margin-top:6px">' + esc(niceD(a.date)) + ' · ' + esc(perTxt(a.period, a.half)) + ' · ' + esc(a.test) + '</div>'; }).join('') + '</details>';
  // My info and My classes, from the school roster (the sheet)
  var m = h.me || {}, rows = (h.schedule.rows || []).filter(function (r) { return r.course; });
  out += '<div class="card"><h2>My info</h2><div class="kv"><div>Name</div><div><b>' + esc(m.name) + '</b></div><div>Student ID</div><div>' + esc(m.sid) + '</div><div>Grade</div><div>' + esc(m.grade) + '</div><div>Campus</div><div>' + esc(m.campus) + '</div><div>School email</div><div>' + esc(m.email) + '</div></div>' +
    '<h3 style="margin-top:16px">My classes</h3>' + (rows.length ? '<table class="t small"><tr><th>Period</th><th>Class</th><th>Teacher</th><th>Room</th></tr>' + rows.map(function (r) { return '<tr><td>' + esc(r.period || r.raw || '?') + esc(r.half ? ' ' + r.half : '') + '</td><td>' + esc(r.course) + '</td><td>' + esc(r.teacher || '') + '</td><td>' + esc(r.room || '') + '</td></tr>'; }).join('') + '</table>' : '<div class="small mute">No classes on file yet.</div>') +
    '<p class="tiny mute" style="margin-bottom:0">' + (h.schedule.source === 'student' ? 'This is the schedule you entered.' : 'From the school roster' + (h.schedule.at ? ', updated ' + esc(niceD(h.schedule.at.slice(0, 10))) : '') + '.') + (pv ? '' : ' Something wrong? <button class="link" onclick="stuSchedule()">Fix my schedule</button>') + '</p></div>';
  out += '</div>';
  $('main').innerHTML = out;
}
function stuCancel(id) {
  var a = SH.upcoming.filter(function (x) { return x.id === id; })[0];
  modal('<h2>Cancel this appointment?</h2><p>' + esc(longD(a.date)) + ', ' + esc(perTxt(a.period, a.half)) + '<br>' + esc(a.test) + ' · ' + esc(a.course) + '</p><p class="mute small">Your seat goes to the next student on the waitlist.</p><div class="row"><button class="btn bad" id="cx" onclick="stuCancelGo(\'' + id + '\')">Yes, cancel it</button><button class="btn" onclick="closeModal()">Keep it</button></div>');
}
function stuCancelGo(id) { busy($('cx'), true); call('api_cancel', id).then(function (h) { closeModal(); toast('Canceled'); stuRefresh(h); }).catch(function (e) { busy($('cx'), false); fail(e); }); }
function stuLeave(id, btn) { if (!confirm('Leave this waitlist?')) return; busy(btn, true); call('api_leaveWaitlist', id).then(stuRefresh).catch(function (e) { busy(btn, false); fail(e); }); }
function stuLooksRight(btn) { busy(btn, true); call('api_scheduleLooksRight').then(function (h) { toast('Thanks!'); stuRefresh(h); }).catch(fail); }
function stuOffer(id, yes, btn, ack) {
  busy(btn, true);
  call('api_answerOffer', id, yes, ack || null).then(function (r) {
    if (r && r.conflict) { busy(btn, false); conflictBox(r.conflict, function (note) { stuOffer(id, true, null, { note: note }); }); return; }
    closeModal(); toast(yes ? 'You’re booked!' : 'Declined'); stuRefresh(r);
  }).catch(function (e) { busy(btn, false); fail(e); call('api_studentHome').then(stuRefresh); });
}

// ---------- booking: class → test → day and period → confirm
function bkStart() { BK = { step: 1, reqId: uid(), half: '' }; bkDraw(); }
function bkDraw() {
  var h = SH, out = '<div class="wrap narrow"><p><button class="link" onclick="drawStu()">← My Testing Center</button></p><h1>Schedule a test</h1><p class="mute small" style="margin-top:0">Step ' + Math.min(BK.step, 3) + ' of 3</p>';
  if (BK.step === 1) {
    out += '<div class="card"><label class="f">Which class is this test for?</label><select id="bkClass" onchange="bkClass(this.value)"><option value="">Choose your class…</option>' + h.classes.map(function (c) { return '<option value="' + esc(c.key) + '"' + (BK.secid === c.key ? ' selected' : '') + '>' + esc(c.label) + '</option>'; }).join('') + '<option value="__other"' + (BK.other ? ' selected' : '') + '>My class isn’t listed</option></select>';
    if (BK.other) out += '<div class="grid2"><div><label class="f">Class</label><input type="text" id="bkOc" value="' + esc(BK.other.course) + '" oninput="BK.other.course=this.value"></div><div><label class="f">Teacher</label><input type="text" id="bkOt" value="' + esc(BK.other.teacher) + '" oninput="BK.other.teacher=this.value"></div></div><p class="small mute">If your schedule changed, you can also <button class="link" onclick="stuSchedule()">fix your schedule</button>.</p>';
    if (BK.secid || BK.other) {
      var tests = (BK.secid && h.tests[BK.secid]) || [];
      out += '<label class="f">Which test?</label>' + tests.map(function (t) { return '<button class="opt' + (BK.aid === t.id ? ' on' : '') + '" onclick="BK.aid=\'' + t.id + '\';BK.test=\'\';bkDraw()">' + esc(t.name) + '</button>'; }).join('') +
        '<input type="text" id="bkTest" placeholder="' + (tests.length ? 'Or type the test name' : 'Type the test name (for example: Unit 3 Test)') + '" value="' + esc(BK.test || '') + '" oninput="BK.test=this.value;BK.aid=\'\'">';
      out += '<label class="f">This is a…</label><div class="row">' + h.purposes.map(function (p) { return '<button class="btn' + (BK.purpose === p ? ' pri' : '') + '" onclick="BK.purpose=\'' + esc(p) + '\';bkDraw()">' + esc(p) + '</button>'; }).join('') + '</div>';
      out += '<label class="f">Is the test online or on paper?</label><div class="row">' + ['Digital', 'Paper', ''].map(function (f) { return '<button class="btn' + (BK.fmt === f && BK.fmtSet ? ' pri' : '') + '" onclick="BK.fmt=\'' + f + '\';BK.fmtSet=1;bkDraw()">' + (f === 'Digital' ? 'Online' : f || 'Not sure') + '</button>'; }).join('') + '</div><p class="tiny mute">Your teacher’s instructions come first; this just helps the Testing Center get ready.</p>';
      out += '<div class="row" style="margin-top:16px"><button class="btn pri" onclick="bkNext()">Next: pick a time →</button></div>';
    }
    out += '</div>';
  } else if (BK.step === 2) {
    out += '<div class="card"><div class="small mute">' + esc(bkClassLabel()) + ' · ' + esc(BK.testName) + ' · ' + esc(BK.purpose) + ' <button class="link" onclick="BK.step=1;bkDraw()">change</button></div></div>';
    if (!BK.slots) { out += '<div class="spin">Finding open periods…</div>'; call('api_slots').then(function (s) { BK.slots = s; BK.day = s.days.length ? s.days[0].date : ''; bkDraw(); }).catch(function (e) { fail(e); BK.step = 1; bkDraw(); }); }
    else if (!BK.slots.days.length) out += '<div class="card empty">No open days right now.</div>';
    else {
      out += '<div class="daytabs">' + BK.slots.days.map(function (d) { return '<button class="daytab' + (d.date === BK.day ? ' on' : '') + '" onclick="BK.day=\'' + d.date + '\';bkDraw()"><b>' + DAYS[dObj(d.date).getDay()] + '</b><div class="small">' + MONTHS[dObj(d.date).getMonth()] + ' ' + dObj(d.date).getDate() + '</div></button>'; }).join('') + '</div>';
      var day = BK.slots.days.filter(function (d) { return d.date === BK.day; })[0];
      if (day.sched && day.sched !== 'Regular') out += '<p class="small mute">' + esc(day.sched) + ' schedule' + (day.note ? ' · ' + esc(day.note) : '') + '</p>';
      day.periods.forEach(function (p) { out += bkSlot(day, p); });
    }
  } else if (BK.step === 3) {
    var cf = BK.conflict;
    out += '<div class="card"><h2>Check your appointment</h2><div class="kv"><div>When</div><div><b>' + esc(longD(BK.date)) + '</b>, ' + esc(perTxt(BK.period, BK.half)) + '</div><div>Where</div><div>' + esc(SH.campusName) + ' Testing Center · ' + esc(SH.where) + '</div><div>Class</div><div>' + esc(bkClassLabel()) + '</div><div>Test</div><div>' + esc(BK.testName) + ' (' + esc(BK.purpose) + ')</div>' + (BK.ack ? '<div>Missing</div><div>' + esc(cf.course) + ' — you said your teacher gave permission. Bring a written pass.</div>' : '') + '</div>' +
      '<ul class="small mute"><li>Tell your teacher you’re testing.</li><li>Bring your student ID.</li>' + (BK.ack ? '<li>Bring the written pass from the teacher whose class you’ll miss.</li>' : '') + '</ul>' +
      '<div class="row"><button class="btn pri big" id="bkGo" onclick="bkBook()">Book it</button><button class="btn" onclick="BK.step=2;bkDraw()">Back</button></div></div>';
  }
  $('main').innerHTML = out + '</div>';
}
function bkClass(v) { if (v === '__other') { BK.other = { course: '', teacher: '' }; BK.secid = ''; } else { BK.secid = v; BK.other = null; } BK.aid = ''; bkDraw(); }
function bkClassLabel() { if (BK.other) return BK.other.course + (BK.other.teacher ? ' — ' + BK.other.teacher : ''); var c = SH.classes.filter(function (x) { return x.key === BK.secid; })[0]; return c ? c.label : ''; }
function bkNext() {
  if (BK.other && !BK.other.course.trim()) return toast('Type the class name.');
  var t = BK.aid ? ((SH.tests[BK.secid] || []).filter(function (x) { return x.id === BK.aid; })[0] || {}).name : (BK.test || '').trim();
  if (!t) return toast('Pick or type the test.');
  if (!BK.purpose) return toast('Choose makeup, retake or finishing a test.');
  BK.testName = t; BK.step = 2; bkDraw();
}
function bkSlot(day, p) {
  if (!p.open) return '<div class="slot closed"><b style="min-width:80px">' + esc(p.label) + '</b><span class="small">' + esc(p.why || 'Closed') + '</span></div>';
  var time = '<div style="min-width:120px"><b>' + esc(p.label) + '</b><div class="small mute">' + hm(p.start) + '–' + hm(p.end) + '</div></div>';
  if (p.soon) return '<div class="slot closed">' + time + '<span class="small">' + (SH.cutoffH ? 'Too soon to book (' + SH.cutoffH + ' hours ahead)' : 'Already started') + '</span></div>';
  var hint = p.conflict ? '<div class="small" style="color:var(--warn)">⚠ You have ' + esc(p.conflict) + '</div>' : p.have.length ? '<div class="small mute">You have ' + p.have.map(function (x) { return esc(x.course) + (x.half ? ' (' + x.half + ')' : ''); }).join(' / ') + '</div>' : '', warn = '';
  var btns = '';
  if (p.ab) {
    var opt = [['A', 'A only', p.free.A > 0], ['B', 'B only', p.free.B > 0], ['AB', 'Whole period', p.free.A > 0 && p.free.B > 0]];
    btns = opt.map(function (o) { return o[2] ? '<button class="btn sm pri" onclick="bkPick(\'' + day.date + '\',\'' + p.period + '\',\'' + o[0] + '\')">' + o[1] + '</button>' : (SH.waitlist ? '<button class="btn sm" onclick="bkWait(\'' + day.date + '\',\'' + p.period + '\',\'' + o[0] + '\')">' + o[1] + ': join waitlist</button>' : '<span class="chip">' + o[1] + ' full</span>'); }).join(' ');
    btns += '<div class="tiny mute" style="width:100%">A ' + Math.max(0, p.free.A) + ' seats · B ' + Math.max(0, p.free.B) + ' seats left</div>';
  } else if (p.free.all > 0) btns = '<button class="btn sm pri" onclick="bkPick(\'' + day.date + '\',\'' + p.period + '\',\'\')">Book</button><span class="tiny mute">' + p.free.all + ' seats left</span>';
  else btns = SH.waitlist ? '<span class="chip">Full</span> <button class="btn sm" onclick="bkWait(\'' + day.date + '\',\'' + p.period + '\',\'\')">Join waitlist</button>' : '<span class="chip">Full</span>';
  return '<div class="slot">' + time + '<div class="grow">' + hint + warn + '</div><div class="row" style="max-width:340px;justify-content:flex-end">' + btns + '</div></div>';
}
function bkReq(d, p, half) { return { reqId: BK.reqId, secid: BK.secid, other: BK.other, aid: BK.aid, test: BK.testName, purpose: BK.purpose, fmt: BK.fmt || '', date: d, period: p, half: half, ack: BK.ack || null }; }
function bkPick(d, p, half) {
  BK.date = d; BK.period = p; BK.half = half; BK.ack = null;
  var day = BK.slots.days.filter(function (x) { return x.date === d; })[0], slot = day.periods.filter(function (x) { return x.period === p; })[0];
  var cf = half === 'A' || half === 'B' ? slot.have.filter(function (x) { return x.type === 'academic' && (!x.half || x.half === half); })[0] : slot.have.filter(function (x) { return x.type === 'academic'; })[0];
  if (cf) { BK.conflict = { course: cf.course, teacher: slot.conflict.replace(/^.* with /, '') }; conflictBox(BK.conflict, function (note) { BK.ack = { note: note }; closeModal(); BK.step = 3; bkDraw(); }); return; }
  BK.step = 3; bkDraw();
}
// the class-conflict warning (students may continue; it's recorded, and is not the same as a teacher's approval)
function conflictBox(cf, go) {
  window.__cfGo = go;
  modal('<h2>⚠ Academic class conflict</h2><p>Your schedule shows that you have <b>' + esc(cf.course) + '</b>' + (cf.teacher ? ' with <b>' + esc(cf.teacher) + '</b>' : '') + ' during this period.</p>' +
    '<p>Students may not miss an academic class to attend the Testing Center without permission from the teacher whose class they will miss. The Testing Center also requires a written pass.</p>' +
    '<button class="opt" onclick="$(\'cfMore\').hidden=false">✋ My teacher gave me permission</button><div id="cfMore" hidden><label class="f">Optional note (for example, when your teacher said yes)</label><textarea id="cfNote" style="min-height:60px"></textarea><button class="btn pri" style="margin-top:8px" onclick="window.__cfGo($(\'cfNote\').value)">Continue</button></div>' +
    '<button class="opt" onclick="closeModal();stuSchedule()">📝 My schedule has changed</button><button class="opt" onclick="closeModal()">← Back — choose another period</button>');
}
function bkBook() {
  var btn = $('bkGo'); busy(btn, true);

    if (r.full) { busy(btn, false); toast('Someone just took that seat. Pick another period or join the waitlist.'); BK.slots = null; BK.step = 2; bkDraw(); return; }
    if (r.conflict) { busy(btn, false); BK.conflict = r.conflict; conflictBox(r.conflict, function (note) { BK.ack = { note: note }; closeModal(); bkBook(); }); return; }
    SH = r.home; modal('<h2>✅ You’re booked</h2><p>' + esc(longD(BK.date)) + ', ' + esc(perTxt(BK.period, BK.half)) + '<br>' + esc(SH.campusName) + ' Testing Center · ' + esc(SH.where) + '</p><p class="small">Remember to tell your teacher and bring your student ID.</p><button class="btn pri" onclick="closeModal();drawStu()">Done</button>'); BK = null;
  }).catch(function (e) { busy(btn, false); fail(e); });
}
function bkWait(d, p, half) {

// ---------- the student's schedule: look, edit period by period, or paste from Infinite Campus
var SCH = null;
function stuSchedule(paste) {
  SCH = SH.schedule.rows.map(function (r) { return { period: r.period, half: r.half || '', course: r.course, teacher: r.teacher || '', secid: r.secid || '' }; });
  schDraw(paste);
}
function schDraw(paste) {
  var src = SH.schedule.source === 'student' ? '<span class="chip warn">You entered this</span> <span class="small mute">The Testing Center will check it against the next school roster.</span>' : '<span class="chip">From the school roster</span>';
  var out = '<div class="wrap narrow"><p><button class="link" onclick="drawStu()">← My Testing Center</button></p><h1>My class schedule</h1><p>' + src + '</p>';
  out += '<div class="card"><table class="t"><tr><th style="width:70px">Period</th><th style="width:70px">A/B</th><th>Class</th><th>Teacher</th><th></th></tr>' + SCH.map(function (r, i) {
    return '<tr><td><input type="text" value="' + esc(r.period) + '" oninput="SCH[' + i + '].period=this.value"></td><td><select onchange="SCH[' + i + '].half=this.value"><option value=""></option><option' + (r.half === 'A' ? ' selected' : '') + '>A</option><option' + (r.half === 'B' ? ' selected' : '') + '>B</option></select></td><td><input type="text" value="' + esc(r.course) + '" oninput="SCH[' + i + '].course=this.value;SCH[' + i + '].secid=\'\'"></td><td><input type="text" value="' + esc(r.teacher) + '" oninput="SCH[' + i + '].teacher=this.value"></td><td><button class="btn sm" onclick="SCH.splice(' + i + ',1);schDraw()">✕</button></td></tr>';
  }).join('') + '</table><div class="row" style="margin-top:10px"><button class="btn sm" onclick="SCH.push({period:\'\',half:\'\',course:\'\',teacher:\'\'});schDraw()">＋ Add a class</button><div class="grow"></div><button class="btn pri" id="schGo" onclick="schSave(\'edit\')">Save my schedule</button></div></div>';
  out += '<details class="card"' + (paste ? ' open' : '') + '><summary><b>📋 Paste my updated schedule from Infinite Campus</b></summary><ol class="small"><li>Open <b>Schedule</b> in Infinite Campus.</li><li>Select the whole page (Ctrl+A or ⌘A) and copy it.</li><li>Paste it here.</li></ol><textarea id="icPaste" placeholder="Paste the schedule page here"></textarea><button class="btn" style="margin-top:8px" onclick="schPaste()">Read my schedule</button></details>';
  $('main').innerHTML = out + '</div>';
}
function schPaste() {
  var rows = parseICSchedule($('icPaste').value);
  if (!rows.length) return toast('That doesn’t look like the Schedule page. Copy the whole Schedule page and try again.');
  SCH = rows; toast('Check it, then press Save'); SCH.__paste = 1; schDraw();
}
function schSave() {
  var list = SCH.filter(function (r) { return String(r.course || '').trim(); });
  if (!list.length) return toast('Add your classes first.');
  var btn = $('schGo'); busy(btn, true);
  call('api_saveMySchedule', list, SCH.__paste ? 'paste' : 'edit').then(function (h) { SH = h; toast('Schedule saved'); drawStu(); }).catch(function (e) { busy(btn, false); fail(e); });
}
// A copied Infinite Campus Schedule page → [{period, half, course, teacher}] (from the Resource Check-In parser).
// Each class line is "Course name LEVEL Last, First M/Last, First Room", followed (or preceded) by its "Period 05" line.
// A split lunch period ("SO Study A/Lunch B") becomes two rows, A and B.
function parseICSchedule(text) {
  var out = [], open = [], buf = [], pending = '';
  var perRe = /^(?:period|per\.?|pd\.?)\s*0*(\d+)\s*([AB])?(?![\w])|^0*(\d+)(?:st|nd|rd|th)\s+period\b/i;
  var classRe = [/^(.+?)\s+(L(?:IV|V|I{1,3}))\s+(.+?,.+?)(?:\s+([A-Z]{1,3}-[A-Z0-9]+))?$/, /^(.+?)\s+([A-Z]{2,3})\s+(.+?,.+?)(?:\s+([A-Z]{1,3}-[A-Z0-9]+))?$/];
  var close = function (per) { open.forEach(function (r) { r.period = per; out.push(r); }); open = []; };
  var tryClass = function () { for (var k = 1; k <= Math.min(4, buf.length); k++) { var line = buf.slice(buf.length - k).join(' '), m = classRe[0].exec(line) || classRe[1].exec(line); if (m && !/^\d{1,2}:\d\d/.test(m[1])) { buf = []; return m; } } return null; };
  String(text || '').replace(/ /g, ' ').split(/\r?\n/).forEach(function (raw) {
    var line = raw.replace(/\t+/g, ' ').trim(), m;
    if (!line) return;
    if ((m = perRe.exec(line))) { var per = String(+(m[1] || m[3])); buf = []; if (open.length) close(per); else pending = per; return; }
    buf.push(line); m = tryClass(); if (!m) return;
    var teacher = m[3].split('/').map(function (n) { var p = n.split(','); return ((p[1] || '').trim().split(/\s+/)[0] + ' ' + p[0].trim()).trim(); }).join(' / ');
    var name = m[1].trim(), split = /^(.+?)\s+A\s*\/\s*(.+?)\s+B$/.exec(name);
    if (split) [[split[1], 'A'], [split[2], 'B']].forEach(function (h) { open.push({ half: h[1], course: h[0], teacher: /lunch/i.test(h[0]) ? '' : teacher }); });
    else open.push({ half: '', course: name, teacher: teacher });
    if (pending) { close(pending); pending = ''; }
  });
  return out.filter(function (r) { return !/counsel|athlet|club/i.test(r.course); });
}
</script>

<script>

    el.innerHTML = '<div class="row" style="gap:8px;flex-wrap:nowrap"><span class="clock-now" id="clockNow"></span><b class="grow">Bell.plus</b><a class="btn sm" href="' + esc(url) + '" target="_blank" title="Open Bell.plus in its own tab">↗</a><button class="btn sm" id="clockSz" onclick="coPref(\'bell\', CO.prefs.bell === false)"></button></div><iframe id="clockFrame" src="' + esc(url) + '" title="Bell.plus" style="width:100%;height:340px;border:0;border-radius:10px;margin-top:8px;background:#fff"></iframe>';

function impMapFields() { var f = {}; IMP.info.fields.forEach(function (x) { var i = IMP.map[x.key]; if (i >= 0) f[x.key] = IMP.headers[i]; else if (i === -1) f[x.key] = ''; }); return f; }

// Step 3: send only the matched columns, 10,000 rows at a time, with a progress bar; then the server compares the whole file.
function impUpload() {

function impJob() {

function impPreviewDraw() {

// CSV (our own reader, in slices so the page never freezes; progress as it goes) or Excel (SheetJS from cdnjs, loaded only for .xlsx)
function readTable(file, prog) {

    var rd = new FileReader();

      var go = function () { prog('Reading the Excel file…', -1); rd.onload = function () { setTimeout(function () { try { var wb = XLSX.read(new Uint8Array(rd.result), { type: 'array', cellDates: false }); ok(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' })); } catch (e) { no(e); } }, 30); }; rd.readAsArrayBuffer(file); };

function parseCSV(text, prog) {
  return new Promise(function (ok) {

        c = text.charAt(i);

}
