// Reliability: the daily health check, the monthly archive of old rows, the weekly backup copy, and the Errors tab.

var ARCHIVED = ['Appointments', 'Sessions', 'Audit', 'Outbox', 'Offers', 'Waitlist'];

function archiveRun_() {          // inside locked_()
  var t = today_(), cut60 = addDays_(t, -60), cut45 = Date.now() - 45 * 86400000, moved = {};
  var keepAppt = function (a) { return day_(a.date) >= cut60 || !/^(completed|partial|canceled|no-show|rescheduled)/i.test(a.status); };

// ---------- the daily health check (banner in the hub; optional morning email)
function health_() {

  var add = function (level, text, fix) { out.items.push({ level: level, text: text, fix: fix || '' }); };

  var days = last ? Math.floor((now - ms_(last.at)) / 86400000) : null;
  out.lastImport = last ? str_(last.at) : '';
  if (days === null) add('warn', 'No Infinite Campus import yet.', 'Settings › Infinite Campus import');
  else if (days > 14) add('warn', 'The last Infinite Campus import was ' + days + ' days ago.', 'Import a fresh export (Settings › Infinite Campus import).');
  else add('ok', 'Infinite Campus import: ' + days + ' day' + (days === 1 ? '' : 's') + ' ago.');
  var failed = rows_('Outbox').filter(function (r) { return /^failed/i.test(r.status) && ms_(r.created) > now - 7 * 86400000; }).length;
  add(failed ? 'bad' : 'ok', failed ? failed + ' email' + (failed > 1 ? 's' : '') + ' failed this week.' : 'No failed emails this week.', failed ? 'Emails › Email log' : '');
  [['tick', 'Waitlist timing (every 10 minutes)', 30], ['morning', 'Morning reminders (6 AM)', 30], ['afternoon', '3:30 emails', 30]].forEach(function (j) {
    var ran = dp.getProperty('ran:' + j[0]), ago = ran ? (now - ms_(ran)) / 3600000 : null, schoolish = j[0] === 'tick' ? 1 : 30;
    if (!ran) add('warn', j[1] + ' hasn’t run yet.', 'Sheet menu: Testing Center › Set up or repair this sheet (it sets up the timers).');
    else if (ago > schoolish * (j[0] === 'tick' ? 1 : 1.6)) add('warn', j[1] + ' last ran ' + Math.round(ago) + ' hours ago.', 'Sheet menu: Testing Center › Set up or repair this sheet.');
    else add('ok', j[1] + ': ran ' + (ago < 1 ? Math.round(ago * 60) + ' minutes' : Math.round(ago) + ' hours') + ' ago.');
  });

  add(pct > 80 ? 'bad' : pct > 60 ? 'warn' : 'ok', 'The sheet is ' + pct + '% full (Google’s limit is 10 million cells).', pct > 60 ? 'Settings › Free up space: clear IC_Raw_Import after an import, and delete old backup tabs.' : '');
  var bak = dp.getProperty('backupAt');
  if (!bak) add('warn', 'No weekly backup copy yet.', 'It runs on Sundays; Settings › Back up now.');
  else add((now - ms_(bak)) / 86400000 > 9 ? 'warn' : 'ok', 'Last backup copy: ' + Math.floor((now - ms_(bak)) / 86400000) + ' days ago.', dp.getProperty('backupUrl') || '');

<div class="top" id="top"><div class="logo"><i>✓</i> <span id="appName">Testing Center</span></div><div class="grow"></div><div id="modes"></div><select id="lookSel" title="Colors" aria-label="Colors" style="width:auto;padding:5px 8px" onchange="setLook(this.value)"><option value="">🎨 Classic</option><option value="auto">🎨 Match my computer</option><option value="calmroom">🎨 Calm classroom</option><option value="night">🎨 Night</option><option value="contrast">🎨 High contrast</option><option value="neon">🎨 🌈 Neon</option><option value="pastelnight">🎨 🍬 Pastel night</option><option value="ocean">🎨 🌊 Ocean</option><option value="sunset">🎨 🌅 Sunset</option><option value="candy">🎨 🍭 Candy shop</option><option value="warm">🎨 Warm</option></select></div>
<div id="main"><div class="spin">Loading…</div></div>

<script>
// ---------- color modes (per device; the page works the same without storage)
function setLook(v) { if (v) document.documentElement.setAttribute('data-look', v); else document.documentElement.removeAttribute('data-look'); try { localStorage.setItem('tcLook', v || ''); } catch (e) {} var el = document.getElementById('lookSel'); if (el) el.value = v || ''; }
(function () { var v = ''; try { v = localStorage.getItem('tcLook') || ''; if (v === 'dark') v = 'night'; if (v === 'calm') v = 'calmroom'; } catch (e) {} if (v) document.documentElement.setAttribute('data-look', v); })();
window.addEventListener('DOMContentLoaded', function () { var v = ''; try { v = localStorage.getItem('tcLook') || ''; } catch (e) {} var el = document.getElementById('lookSel'); if (el) el.value = v; });
// ---------- shared by every page
var B = null, MODE = '', START = {};
function call(fn) {
  var args = [].slice.call(arguments, 1); window.__lastCall = fn;
  return new Promise(function (ok, no) { var r = google.script.run.withSuccessHandler(ok).withFailureHandler(no); r[fn].apply(r, args); });
}
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s === undefined || s === null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function toast(m) { var t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(function () { t.remove(); }, 3200); }
function fail(e) {
  var m = (e && e.message) || String(e);
  if (/TypeError|ReferenceError|RangeError|SyntaxError|is not a function|Cannot read prop|undefined|Exception: Service|Internal error|timed out|Exceeded/i.test(m)) {
    try { google.script.run.api_logError(MODE + ' ' + (window.__lastCall || ''), m); } catch (x) {}
    m = 'Something went wrong on our side, and it was written down so it can be fixed. Please try again in a moment.';
  }
  toast(m); console.error(e);
}
function busy(btn, on) { if (btn) { btn.disabled = on; if (on) { btn.dataset.t = btn.innerHTML; btn.innerHTML = '…'; } else if (btn.dataset.t) btn.innerHTML = btn.dataset.t; } }
function modal(html, wide) { $('layer').innerHTML = '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal' + (wide ? ' wide' : '') + '">' + html + '</div></div>'; }
function closeModal() { $('layer').innerHTML = ''; }
function uid() { return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function dObj(d) { return new Date(d + 'T12:00:00'); }
function niceD(d) { if (!d) return ''; var x = dObj(d); return DAYS[x.getDay()] + ' ' + MONTHS[x.getMonth()] + ' ' + x.getDate(); }
function longD(d) { if (!d) return ''; var x = dObj(d); return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][x.getDay()] + ', ' + MONTHS[x.getMonth()] + ' ' + x.getDate(); }
function relD(d) { if (d === B.today) return 'Today'; var t = dObj(B.today); t.setDate(t.getDate() + 1); if (dObj(d).toDateString() === t.toDateString()) return 'Tomorrow'; return niceD(d); }
function hm(t) { if (!t) return ''; var p = t.split(':'), h = +p[0]; return (h % 12 || 12) + ':' + p[1] + (h < 12 ? ' AM' : ' PM'); }
function timeOf(iso) { if (!iso) return ''; var x = new Date(iso); return x.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function halfTxt(h) { return h === 'A' ? 'A half' : h === 'B' ? 'B half' : h === 'AB' ? 'Whole period' : ''; }
function perTxt(p, h) { return 'Period ' + p + (h && h !== '' ? ' · ' + halfTxt(h) : ''); }
function untilTxt(iso) { var m = Math.round((new Date(iso).getTime() - Date.now()) / 60000); if (m <= 0) return 'ending now'; if (m < 60) return m + ' min left'; return Math.floor(m / 60) + ' h ' + (m % 60) + ' min left'; }
function statusChip(s) { var c = /complete/i.test(s) && !/partial/i.test(s) ? 'ok' : /testing/i.test(s) ? 'blue' : /checked/i.test(s) ? 'warn' : /no-show|missed/i.test(s) ? 'bad' : /partial|paused/i.test(s) ? 'warn' : /waiting|offer/i.test(s) ? 'info' : ''; return '<span class="chip ' + c + '">' + esc(/^checked/i.test(s) ? 'Arrived' : s) + '</span>'; }
var COLOR_KEY = '<div class="tiny" style="display:flex;gap:10px;flex-wrap:wrap;margin:-4px 0 12px"><span class="chip bad">Missing / no-show</span><span class="chip warn">Check / arrived</span><span class="chip ok">Ready / done</span><span class="chip blue">Testing</span><span class="chip info">Waitlist / offer</span><span class="chip">Scheduled / canceled</span></div>';
function readyChip(r) { if (!r) return ''; var c = r.state === 'Ready' ? 'ok' : r.state === 'Check' ? 'warn' : 'bad'; return '<span class="chip ' + c + '" title="' + esc(r.missing.join(', ')) + '">' + esc(r.state) + '</span>'; }
function fmtChip(r) { if (!r) return ''; var conf = /^teacher/.test(r.fsource); return r.format ? '<span class="chip" title="' + esc(r.ftext) + '">' + (conf ? '✓ ' : '~ ') + esc(r.format) + '</span>' : '<span class="chip" title="' + esc(r.ftext) + '">?</span>'; }

// ---------- start
function switchUrl() { return 'https:' + '/' + '/accounts.google.com/AccountChooser?continue=' + encodeURIComponent((B && B.url) || location.href); }
function boot() {
  call('api_boot').then(function (b) { B = b; drawModes(START.hub ? 'staff' : ''); }).catch(function (e) { $('main').innerHTML = '<div class="wrap narrow"><div class="card bad"><h2>Something went wrong</h2><p>' + esc(e.message || e) + '</p></div></div>'; });
}
// Which views this account gets: teachers open "My classes" (with a Student view), students their dashboard, coordinators the hub (password).
function drawModes(want) {
  var b = B;
  if (b.error === 'signin') { $('main').innerHTML = '<div class="wrap narrow"><div class="card"><h2>Please sign in</h2><p>Sign in with your school Google account, then reload this page.</p></div></div>'; return; }
  var modes = [], hubOk = !!(b.staff || (b.hub && b.hub.eligible));
  if (b.teacher) { modes.push(['teacher', 'My classes']); modes.push(['tview', 'Student view']); }
  if (b.student) modes.push(['student', 'My Testing Center']);
  var showLogin = hubOk || !!b.teacher;          // everyone but students sees the coordinator log-in button
  if (!modes.length && !showLogin) { $('main').innerHTML = '<div class="wrap narrow"><div class="card"><h2>We couldn’t find you</h2><p>You’re signed in as <b>' + esc(b.email) + '</b>, but that account isn’t on the Testing Center roster yet. If you’re a student, ask the Testing Center to check your school email. If you’re a teacher, your email may still need to be confirmed.</p><p><a class="btn pri" href="' + switchUrl() + '" target="_top">Switch to my school account</a></p><p class="small mute">Signed in to more than one Google account? Google opens this app with the first one you signed in to. Use the button above, or open the link in a Chrome window or profile that has only your school account (@d204.lths.net or @lths.net).</p></div></div>'; return; }
  if (!modes.length) modes.push(['welcome', 'Home']);
  var ids = modes.map(function (m) { return m[0]; });
  // coordinators open on the teacher dashboard too; the coordinator tools are one button away (top right)
  MODE = want === 'staff' && b.staff ? 'staff' : want && ids.indexOf(want) >= 0 ? want : modes[0][0];
  $('modes').innerHTML = (modes.length > 1 ? '<div class="seg">' + modes.map(function (m) { return '<button id="mode-' + m[0] + '" onclick="setMode(\'' + m[0] + '\')">' + m[1] + '</button>'; }).join('') + '</div>' : '') +
    (showLogin ? '<span id="hubBtn"></span>' : '') + '<span class="mute small" style="margin-left:10px" title="' + esc(b.email) + '">' + esc(b.name || b.email) + ' · <a href="' + switchUrl() + '" target="_top">Wrong account?</a></span>';
  setMode(MODE);
  if (want === 'staff' && !b.staff && hubOk) hubGate();
}
function hubBtnDraw() {
  var el = $('hubBtn'); if (!el) return;
  el.innerHTML = MODE === 'staff' ? (B.teacher ? '<button class="btn hubbtn" onclick="setMode(\'teacher\')">← Teacher view</button>' : '')
    : B.staff ? '<button class="btn pri hubbtn" onclick="setMode(\'staff\')">🗂️ Coordinator tools</button>'
    : '<button class="btn pri hubbtn" onclick="hubGate()">🔒 Testing Center Coordinator Log In</button>';
}
function setMode(m) {
  MODE = m; [].forEach.call(document.querySelectorAll('#modes .seg button'), function (x) { x.classList.toggle('on', x.id === 'mode-' + m); });
  if (m !== 'staff' && typeof clockStop === 'function') clockStop();
  hubBtnDraw();
  if (m === 'student') stuStart(); else if (m === 'teacher') tchStart(); else if (m === 'tview') tvStart(); else if (m === 'staff' && B.staff) coStart();
  else $('main').innerHTML = '<div class="wrap narrow"><div class="card" style="text-align:center;padding:30px"><h2>Welcome to the Testing Center app</h2><p class="mute">Testing Center staff: use <b>Testing Center Coordinator Log In</b> at the top right to open the coordinator tools.</p><button class="btn pri big" onclick="' + (B.staff ? 'setMode(\'staff\')">🗂️ Coordinator tools' : 'hubGate()">🔒 Testing Center Coordinator Log In') + '</button></div></div>';
}
// ---------- the coordinator log-in (a password box over the teacher dashboard)
function hubGate() {
  var h = B.hub || {}, out = '<h2>🔒 Testing Center Coordinator Log In</h2>';
  if (!h.eligible && !h.owner) out += '<p>This account isn’t set up for the coordinator tools. If you work in the Testing Center, ask the Testing Center administrator to add your school email.</p><button class="btn" onclick="closeModal()">Close</button>';
  else if (!h.hasPassword && h.owner) out += '<p class="small">Create the password coordinators will use. Only its scrambled form is stored; you can change it later in Settings.</p><label class="f">New password (8 or more characters)</label><input type="password" id="hubNew"><label class="f">Type it again</label><input type="password" id="hubNew2"><div class="row" style="margin-top:12px"><button class="btn pri" id="hubGo">Create password and open</button><button class="btn" onclick="closeModal()">Cancel</button></div>';
  else if (!h.hasPassword) out += '<p>The administrator hasn’t set the coordinator password yet.</p><button class="btn" onclick="closeModal()">Close</button>';
  else out += '<p class="small mute">Enter the Testing Center coordinator password.</p><input type="password" id="hubPw" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')$(\'hubGo\').click()"><div class="row" style="margin-top:12px"><button class="btn pri" id="hubGo">Log in</button><button class="btn" onclick="closeModal()">Cancel</button></div><p class="tiny mute">You stay logged in on this account for 6 hours, or until you press Lock.</p>';
  modal(out);
  if ($('hubGo')) $('hubGo').onclick = function () {
    var btn = this, p;
    if ($('hubNew')) { if ($('hubNew').value !== $('hubNew2').value) return toast('The two passwords don’t match.'); p = call('api_hubSetPassword', $('hubNew').value, ''); }
    else p = call('api_hubUnlock', $('hubPw').value);
    busy(btn, true); p.then(function (b) { B = b; closeModal(); drawModes('staff'); }).catch(function (e) { busy(btn, false); fail(e); });
  };
  setTimeout(function () { var x = $('hubPw') || $('hubNew'); if (x) x.focus(); }, 50);
}
function hubLock() { call('api_hubLock').then(function (b) { B = b; drawModes(''); toast('The hub is locked'); }).catch(fail); }
window.addEventListener('load', function () {
  if (google.script.url && google.script.url.getLocation) google.script.url.getLocation(function (loc) { START = loc.parameter || {}; boot(); });
  else boot();
});
</script>
<script>
// ---------- the student's page: My Testing Center, booking, the waitlist, and fixing their schedule
var SH = null, BK = null;          // SH = home data; BK = the booking in progress
function stuStart() {
  SH = B.student; drawStu();
  if (START.cancel) { var c = START.cancel; START.cancel = ''; if (SH.upcoming.some(function (a) { return a.id === c && a.canCancel; })) stuCancel(c); else toast('That appointment can’t be canceled any more (or it’s already canceled).'); }
  if (START.noshow) { var n = START.noshow, how = START['do']; START.noshow = ''; stuNoShow(n, how); }
}
// from the no-show email: save the test (I'll rebook) or toss it
function stuNoShow(id, how) {
  var a = SH.recent.filter(function (x) { return x.id === id; })[0];
  if (!a) return toast('That missed appointment isn’t on your list.');
  modal('<h2>You missed your appointment</h2><p>' + esc(longD(a.date)) + ', ' + esc(perTxt(a.period, a.half)) + '<br>' + esc(a.test) + ' · ' + esc(a.course) + '</p>' + (a.nsChoice ? '<p class="small">You already told us: <b>' + esc(a.nsChoice) + '</b>. You can change it:</p>' : '<p class="small">What should the Testing Center do with your test?</p>') +
    '<button class="opt' + (how === 'save' ? ' on' : '') + '" onclick="stuNoShowGo(\'' + id + '\', \'save\')">💾 Save it, I’ll make another appointment</button><button class="opt' + (how === 'toss' ? ' on' : '') + '" onclick="stuNoShowGo(\'' + id + '\', \'toss\')">🗑️ Toss it, I changed my mind and am not planning to take it</button><button class="opt" onclick="closeModal()">Not now</button>');
}
function stuNoShowGo(id, how) { call('api_noShowChoice', id, how).then(function (h) { SH = h; closeModal(); drawStu(); toast(how === 'save' ? 'Thanks! Your test is saved. Book a new time below.' : 'Thanks, we’ll let your teacher know.'); }).catch(fail); }
function stuRefresh(h) { if (h) SH = h; drawStu(); }
function drawStu() {
  var h = SH, pv = !!h.preview, out = '<div class="wrap narrow">';
  if (pv) h = Object.assign({}, h, { booking: false, offers: [], askSchedule: false });
  if (pv) out += '<p><button class="link" onclick="tvStart()">← My students</button></p><div class="banner info small">You’re looking at <b>' + esc(h.me.name) + '</b>’s Testing Center page, as their teacher. Nothing can be booked or canceled here.</div>';
  out += '<h1>' + (pv ? esc(h.me.name.split(' ')[0]) + '’s Testing Center' : 'Hi, ' + esc(h.first) + '!') + '</h1><p class="mute" style="margin-top:0">' + esc(h.campusName) + ' Testing Center · ' + esc(h.where) + '</p>';
  h.offers.forEach(function (o) {
    out += '<div class="banner ok"><h3>🎉 A seat opened up for you</h3><p style="margin:4px 0 10px">' + esc(longD(o.date)) + ', ' + esc(perTxt(o.period, o.half)) + (o.test ? ' · ' + esc(o.test) : '') + '.<br><b>You are not booked yet.</b> Accept to take the seat, or decline so the next student can have it. <span class="mute">(' + untilTxt(o.expires) + ')</span></p>' +
      '<div class="row"><button class="btn ok" onclick="stuOffer(\'' + o.id + '\', true, this)">Accept</button><button class="btn" onclick="stuOffer(\'' + o.id + '\', false, this)">Decline</button></div></div>';
  });
  if (h.askSchedule && h.schedule.rows.length) out += '<div class="banner info"><b>Is your class schedule right?</b><div class="small mute" style="margin:2px 0 8px">We use it to fill in your classes and warn you about missing a class.</div><div class="row"><button class="btn sm" onclick="stuLooksRight(this)">My schedule looks correct</button><button class="btn sm" onclick="stuSchedule()">Edit my schedule</button><button class="btn sm" onclick="stuSchedule(true)">Paste my updated schedule from Infinite Campus</button></div></div>';
  out += pv ? '<div class="card" style="text-align:center"><span class="mute small">Students make and cancel appointments here.</span></div>' : h.booking ? '<div class="card" id="avail"><h2>Book a Testing Center appointment</h2><p class="small mute" style="margin:0 0 10px"><b>1.</b> Pick a day. <b>2.</b> Pick a time that’s open. <b>3.</b> Tell us the class and the test.</p><div id="availBody"><div class="spin">Finding open periods…</div></div></div>' : '<div class="card" style="text-align:center;padding:22px"><b>Sign up in SignUpGenius for now.</b><div class="mute small">The Testing Center is moving to this app soon.</div></div>';
  out += '<div class="card"><h2>Coming up</h2>' + (h.upcoming.length ? h.upcoming.map(function (a) {
    return '<div class="slot"><div class="grow"><b>' + esc(relD(a.date)) + ' · ' + esc(perTxt(a.period, a.half)) + '</b><div>' + esc(a.test) + ' <span class="mute">· ' + esc(a.course) + '</span></div><div class="small mute">' + esc(a.purpose) + (a.missed ? ' · You’ll miss ' + esc(a.missed) + ': bring a pass' : '') + '</div></div>' +
      (a.start && !pv ? '<a class="btn sm" target="_blank" title="Add to my Google Calendar" href="' + gcalUrl(a.date, a.start, a.end, 'Testing Center: ' + a.test, h.campusName + ' Testing Center, ' + h.where) + '">📅</a>' : '') + (a.canCancel && !pv ? '<button class="btn sm bad" onclick="stuCancel(\'' + a.id + '\')">Cancel</button>' : statusChip(a.status)) + '</div>';
  }).join('') : '<div class="empty">No appointments yet.</div>') + '</div>';
  if (h.waits.length) out += '<div class="card"><h2>Waitlists</h2>' + h.waits.map(function (x) {
    return '<div class="slot"><div class="grow"><b>' + esc(relD(x.date)) + ' · ' + esc(perTxt(x.period, x.half)) + '</b><div class="small">' + esc(x.test) + ' · ' + esc(x.course) + '</div><div class="small mute">You’re <b>#' + x.pos + '</b> of ' + x.of + ' waiting. We’ll email you if a seat opens.</div></div>' + (pv ? '' : '<button class="btn sm" onclick="stuLeave(\'' + x.id + '\', this)">Leave</button>') + '</div>';
  }).join('') + '</div>';
  if (h.recent.length) out += '<div class="card"><h2>Recent</h2>' + h.recent.map(function (a) { var ns = /^no-show/i.test(a.status); return '<div class="slot"><div class="grow">' + esc(niceD(a.date)) + ' · ' + esc(a.test) + ' <span class="mute">· ' + esc(a.course) + '</span>' + (ns ? '<div class="tiny">' + (a.nsChoice ? 'You told us: ' + esc(a.nsChoice) : 'You missed this one. What should we do with the test?') + '</div>' : '') + '</div>' + (ns && !pv ? '<button class="btn sm" onclick="stuNoShow(\'' + a.id + '\')">' + (a.nsChoice ? 'Change' : 'Save or toss') + '</button>' : '') + statusChip(ns ? 'Missed' : a.status) + '</div>'; }).join('') + '</div>';
  if (h.canceled.length) out += '<details class="card"><summary class="mute">Canceled (' + h.canceled.length + ')</summary>' + h.canceled.map(function (a) { return '<div class="small" style="margin-top:6px">' + esc(niceD(a.date)) + ' · ' + esc(perTxt(a.period, a.half)) + ' · ' + esc(a.test) + '</div>'; }).join('') + '</details>';
  // My info and My classes, from the school roster (the sheet)
  var m = h.me || {}, rows = (h.schedule.rows || []).filter(function (r) { return r.course; });
  out += '<div class="card"><h2>My info</h2><div class="kv"><div>Name</div><div><b>' + esc(m.name) + '</b></div><div>Student ID</div><div>' + esc(m.sid) + '</div><div>Grade</div><div>' + esc(m.grade) + '</div><div>Campus</div><div>' + esc(m.campus) + '</div><div>School email</div><div>' + esc(m.email) + '</div></div>' +
    '<h3 style="margin-top:16px">My classes</h3>' + (rows.length ? '<table class="t small"><tr><th>Period</th><th>Class</th><th>Teacher</th><th>Room</th></tr>' + rows.map(function (r) { return '<tr><td>' + esc(r.period || r.raw || '?') + esc(r.half ? ' ' + r.half : '') + '</td><td>' + esc(r.course) + '</td><td>' + esc(r.teacher || '') + '</td><td>' + esc(r.room || '') + '</td></tr>'; }).join('') + '</table>' : '<div class="small mute">No classes on file yet.</div>') +
    '<p class="tiny mute" style="margin-bottom:0">' + (h.schedule.source === 'student' ? 'This is the schedule you entered.' : 'From the school roster' + (h.schedule.at ? ', updated ' + esc(niceD(h.schedule.at.slice(0, 10))) : '') + '.') + (pv ? '' : ' Something wrong? <button class="link" onclick="stuSchedule()">Fix my schedule</button>') + '</p></div>';
  out += '</div>';
  $('main').innerHTML = out;
  if (h.booking && !pv) availLoad();
}
function stuCancel(id) {
  var a = SH.upcoming.filter(function (x) { return x.id === id; })[0];
  modal('<h2>Are you sure you want to cancel?</h2><p>' + esc(longD(a.date)) + ', ' + esc(perTxt(a.period, a.half)) + '<br>' + esc(a.test) + ' · ' + esc(a.course) + '</p><p class="mute small">Your seat goes to the next student on the waitlist.</p><div class="row"><button class="btn pri" onclick="closeModal()">No, keep my appointment</button><button class="btn bad" id="cx" onclick="stuCancelGo(\'' + id + '\')">Yes, cancel it</button></div>');
}
function stuCancelGo(id) { busy($('cx'), true); call('api_cancel', id).then(function (h) { closeModal(); toast('Canceled'); stuRefresh(h); }).catch(function (e) { busy($('cx'), false); fail(e); }); }
function stuLeave(id, btn) { if (!confirm('Leave this waitlist?')) return; busy(btn, true); call('api_leaveWaitlist', id).then(stuRefresh).catch(function (e) { busy(btn, false); fail(e); }); }
function stuLooksRight(btn) { busy(btn, true); call('api_scheduleLooksRight').then(function (h) { toast('Thanks!'); stuRefresh(h); }).catch(fail); }
function stuOffer(id, yes, btn, ack) {
  busy(btn, true);
  call('api_answerOffer', id, yes, ack || null).then(function (r) {
    if (r && r.conflict) { busy(btn, false); conflictBox(r.conflict, function (note) { stuOffer(id, true, null, { note: note }); }); return; }
    closeModal(); toast(yes ? 'You’re booked!' : 'Declined'); stuRefresh(r);
  }).catch(function (e) { busy(btn, false); fail(e); call('api_studentHome').then(stuRefresh); });
}

// ---------- booking, time first: the open periods are on the first page → pick one → class, test, purpose → confirm
var AV = null;          // { slots, day }
function availLoad(keepDay) {
  call('api_slots').then(function (sl) { AV = { slots: sl, day: keepDay && sl.days.some(function (d) { return d.date === keepDay; }) ? keepDay : (sl.days[0] || {}).date }; availDraw(); })
    .catch(function (e) { var el = $('availBody'); if (el) el.innerHTML = '<div class="small" style="color:var(--bad)">' + esc(e.message || e) + '</div>'; });
}
function availDraw() {
  var el = $('availBody'); if (!el || !AV) return;
  if (!AV.slots.days.length) { el.innerHTML = '<div class="empty">No open periods right now.</div>'; return; }

    if (BK.other) out += '<div class="grid2"><div><label class="f">Class</label><input type="text" value="' + esc(BK.other.course) + '" oninput="BK.other.course=this.value"></div><div><label class="f">Teacher</label><input type="text" value="' + esc(BK.other.teacher) + '" oninput="BK.other.teacher=this.value"></div></div><p class="small mute">If your schedule changed, you can also <button class="link" onclick="stuSchedule()">fix your schedule</button>.</p>';
    if (BK.secid || BK.other) {

      out += '<label class="f">Which test?</label>' + tests.map(function (t, i) { var on = t.id ? BK.aid === t.id : (!BK.aid && BK.test === t.name); return '<button class="opt' + (on ? ' on' : '') + '" onclick="bkTestPick(' + i + ')">' + esc(t.name) + (t.fromClass ? ' <span class="tiny mute">(a classmate booked this)</span>' : '') + '</button>'; }).join('') +
        '<input type="text" placeholder="' + (tests.length ? 'Or type the test name' : 'Type the test name (for example: Unit 3 Test)') + '" value="' + esc(BK.test || '') + '" oninput="BK.test=this.value;BK.aid=\'\'">' +
        '<label class="f">This is a…</label><div class="row">' + h.purposes.map(function (p) { return '<button class="btn' + (BK.purpose === p ? ' pri' : '') + '" onclick="BK.purpose=\'' + esc(p) + '\';bkDraw()">' + esc(p) + '</button>'; }).join('') + '</div>' +
        '<label class="f">Is the test online or on paper?</label><div class="row">' + ['Digital', 'Paper', ''].map(function (f) { return '<button class="btn' + (BK.fmt === f && BK.fmtSet ? ' pri' : '') + '" onclick="BK.fmt=\'' + f + '\';BK.fmtSet=1;bkDraw()">' + (f === 'Digital' ? 'Online' : f || 'Not sure') + '</button>'; }).join('') + '</div>' +
        '<div class="row" style="margin-top:16px"><button class="btn pri" onclick="bkNext()">Next →</button></div>';

function bkTestPick(i) { var t = (SH.tests[BK.secid] || [])[i]; if (!t) return; if (t.id) { BK.aid = t.id; BK.test = ''; } else { BK.aid = ''; BK.test = t.name; } bkDraw(); }
// a Google Calendar link for one appointment (opens Google Calendar with it filled in; the student presses Save)

function bkClass(v) { if (v === '__other') { BK.other = { course: '', teacher: '' }; BK.secid = ''; } else { BK.secid = v; BK.other = null; } BK.aid = ''; bkDraw(); }
function bkClassLabel() { if (BK.other) return BK.other.course + (BK.other.teacher ? ' — ' + BK.other.teacher : ''); var c = SH.classes.filter(function (x) { return x.key === BK.secid; })[0]; return c ? c.label : ''; }

    '<button class="opt" onclick="closeModal();stuSchedule()">📝 My schedule has changed</button><button class="opt" onclick="closeModal()">← Back — choose another period</button>');

function bkBook() {

var SCH = null;
function stuSchedule(paste) {

  schDraw(paste);

function schDraw(paste) {
  var src = SH.schedule.source === 'student' ? '<span class="chip warn">You entered this</span> <span class="small mute">The Testing Center will check it against the next school roster.</span>' : '<span class="chip">From the school roster</span>';
  var out = '<div class="wrap narrow"><p><button class="link" onclick="drawStu()">← My Testing Center</button></p><h1>My class schedule</h1><p>' + src + '</p>';
  out += '<div class="card"><table class="t"><tr><th style="width:70px">Period</th><th style="width:70px">A/B</th><th>Class</th><th>Teacher</th><th></th></tr>' + SCH.map(function (r, i) {
    return '<tr><td><input type="text" value="' + esc(r.period) + '" oninput="SCH[' + i + '].period=this.value"></td><td><select onchange="SCH[' + i + '].half=this.value"><option value=""></option><option' + (r.half === 'A' ? ' selected' : '') + '>A</option><option' + (r.half === 'B' ? ' selected' : '') + '>B</option></select></td><td><input type="text" value="' + esc(r.course) + '" oninput="SCH[' + i + '].course=this.value;SCH[' + i + '].secid=\'\'"></td><td><input type="text" value="' + esc(r.teacher) + '" oninput="SCH[' + i + '].teacher=this.value"></td><td><button class="btn sm" onclick="SCH.splice(' + i + ',1);schDraw()">✕</button></td></tr>';
  }).join('') + '</table><div class="row" style="margin-top:10px"><button class="btn sm" onclick="SCH.push({period:\'\',half:\'\',course:\'\',teacher:\'\'});schDraw()">＋ Add a class</button><div class="grow"></div><button class="btn pri" id="schGo" onclick="schSave(\'edit\')">Save my schedule</button></div></div>';
  out += '<details class="card"' + (paste ? ' open' : '') + '><summary><b>📋 Paste my updated schedule from Infinite Campus</b></summary><ol class="small"><li>Open <b>Schedule</b> in Infinite Campus.</li><li>Select the whole page (Ctrl+A or ⌘A) and copy it.</li><li>Paste it here.</li></ol><textarea id="icPaste" placeholder="Paste the schedule page here"></textarea><button class="btn" style="margin-top:8px" onclick="schPaste()">Read my schedule</button></details>';

// A copied Infinite Campus Schedule page → [{period, half, course, teacher}] (from the Resource Check-In parser).
// Each class line is "Course name LEVEL Last, First M/Last, First Room", followed (or preceded) by its "Period 05" line.
// A split lunch period ("SO Study A/Lunch B") becomes two rows, A and B.
function parseICSchedule(text) {
  var out = [], open = [], buf = [], pending = '';
  var perRe = /^(?:period|per\.?|pd\.?)\s*0*(\d+)\s*([AB])?(?![\w])|^0*(\d+)(?:st|nd|rd|th)\s+period\b/i;
  var classRe = [/^(.+?)\s+(L(?:IV|V|I{1,3}))\s+(.+?,.+?)(?:\s+([A-Z]{1,3}-[A-Z0-9]+))?$/, /^(.+?)\s+([A-Z]{2,3})\s+(.+?,.+?)(?:\s+([A-Z]{1,3}-[A-Z0-9]+))?$/];
  var close = function (per) { open.forEach(function (r) { r.period = per; out.push(r); }); open = []; };
  var tryClass = function () { for (var k = 1; k <= Math.min(4, buf.length); k++) { var line = buf.slice(buf.length - k).join(' '), m = classRe[0].exec(line) || classRe[1].exec(line); if (m && !/^\d{1,2}:\d\d/.test(m[1])) { buf = []; return m; } } return null; };
  String(text || '').replace(/ /g, ' ').split(/\r?\n/).forEach(function (raw) {
    var line = raw.replace(/\t+/g, ' ').trim(), m;
    if (!line) return;
    if ((m = perRe.exec(line))) { var per = String(+(m[1] || m[3])); buf = []; if (open.length) close(per); else pending = per; return; }
    buf.push(line); m = tryClass(); if (!m) return;
    var teacher = m[3].split('/').map(function (n) { var p = n.split(','); return ((p[1] || '').trim().split(/\s+/)[0] + ' ' + p[0].trim()).trim(); }).join(' / ');
    var name = m[1].trim(), split = /^(.+?)\s+A\s*\/\s*(.+?)\s+B$/.exec(name);
    if (split) [[split[1], 'A'], [split[2], 'B']].forEach(function (h) { open.push({ half: h[1], course: h[0], teacher: /lunch/i.test(h[0]) ? '' : teacher }); });
    else open.push({ half: '', course: name, teacher: teacher });
    if (pending) { close(pending); pending = ''; }
  });
  return out.filter(function (r) { return !/counsel|athlet|club/i.test(r.course); });
}

function impMapDraw() {

    '<table class="t small" style="margin-top:8px"><tr><th>Field</th><th>Column in the file</th><th>First 3 rows</th><th>Check</th></tr>' + rows + '</table>' +
    '<div class="row" style="margin-top:10px"><input type="text" id="impName" style="width:auto;flex:1" value="' + esc(m.use || m.defaultName) + '"><button class="btn" onclick="impMapSave()">Save mapping</button></div><p class="tiny mute">A mapping saves only column names, never student information. Matching is by column name, so the columns can be in any order next time.</p>' +
    '<div class="row" style="margin-top:12px"><button class="btn pri" id="impPv"' + (bad ? ' disabled' : '') + '>Next: check the whole file</button><button class="btn" onclick="closeModal()">Cancel</button>' + (bad ? '<span class="small" style="color:var(--bad)">Fix the ✕ rows first (or set a column to “Not in this file”).</span>' : '') + '</div>', true);

function impMapFields() { var f = {}; IMP.info.fields.forEach(function (x) { var i = IMP.map[x.key]; if (i >= 0) f[x.key] = IMP.headers[i]; else if (i === -1) f[x.key] = ''; }); return f; }
function impMapSave() { var name = $('impName').value.trim(); if (!name) return toast('Name the mapping.'); call('api_saveMapping', IMP.kind, name, impMapFields()).then(function () { toast('Mapping saved: ' + name); return impMapLoad(name); }).catch(fail); }
function impMapDel() { var n = IMP.info.use; if (!confirm('Delete the saved mapping “' + n + '”?')) return; call('api_deleteMapping', IMP.kind, n).then(function () { toast('Deleted'); return impMapLoad('#default'); }).catch(fail); }
// Step 3: send only the matched columns, 10,000 rows at a time, with a progress bar; then the server compares the whole file.
function impUpload() {
  if (IMP.tab) {          // the server reads the tab itself: nothing to send
    modal('<h2>Checking the whole tab</h2><p class="small mute">Step 3 of 4. Nothing is imported yet.</p><div id="impProg"></div>', true);
    impProg('Reading ' + IMP.total.toLocaleString() + ' rows from “' + IMP.tab + '” and comparing them with what’s on file… (a big tab can take a minute)', -1);
    return call('api_importPreview', impJob()).then(function (p) { IMP.preview = p; impPreviewDraw(); }).catch(function (e) { fail(e); impMapDraw(); });

  var send = function (k) {
    if (k >= chunks) { impProg('Comparing ' + IMP.rows.length.toLocaleString() + ' rows with what’s on file…', -1); return call('api_importPreview', impJob()).then(function (p) { IMP.preview = p; impPreviewDraw(); }); }

    var part = IMP.rows.slice(k * N, (k + 1) * N).map(function (r) { return cols.map(function (c) { return r[c] === undefined ? '' : r[c]; }); });

}
function impJob() {
  if (IMP.tab) { var m = {}; Object.keys(IMP.map).forEach(function (k) { if (IMP.map[k] >= 0) m[k] = IMP.map[k]; }); return { kind: IMP.kind, campus: IMP.campus, mode: IMP.mode, file: IMP.file, tab: IMP.tab, map: m }; }
  return { kind: IMP.kind, campus: IMP.campus, mode: IMP.mode, file: IMP.file, headers: IMP.sendHeaders, map: IMP.sendMap, stage: IMP.stage, chunks: IMP.chunks }; }
function impPreviewDraw() {
  var p = IMP.preview, out = '<h2>Before importing</h2><p class="small mute">Step 4 of 4. Nothing has changed yet.</p>';

    out += '<div class="tiles"><div class="tile"><b>' + p.students.addCount.toLocaleString() + '</b><span>New students</span></div><div class="tile"><b>' + (p.changes.meaningful.length + p.changes.routine).toLocaleString() + '</b><span>Schedule changes (' + p.changes.meaningful.length + ' that matter)</span></div><div class="tile"><b>' + p.students.goneCount.toLocaleString() + '</b><span>Withdrawals (not in this roster)</span></div><div class="tile"><b>' + p.students.same.toLocaleString() + '</b><span>Students unchanged</span></div></div>' +
      '<div class="tiles"><div class="tile"><b>+' + p.enroll.add.toLocaleString() + '</b><span>Classes added</span></div><div class="tile"><b>−' + p.enroll.drop.toLocaleString() + '</b><span>Classes dropped</span></div><div class="tile"><b>' + p.enroll.keep.toLocaleString() + '</b><span>Classes unchanged</span></div><div class="tile"><b>' + p.students.changeCount + '</b><span>Students with new details</span></div><div class="tile"><b>' + p.teachers.add.length + '</b><span>New teachers</span></div></div>';
    if (p.changes.meaningful.length) out += '<details' + (p.changes.meaningful.some(function (m) { return m.booking; }) ? ' open' : '') + '><summary class="small"><b>Schedule changes that matter</b></summary><table class="t small"><tr><th>Student</th><th>Period</th><th>From</th><th>To</th><th></th></tr>' + p.changes.meaningful.slice(0, 80).map(function (m) { return '<tr><td>' + esc(m.name) + '</td><td>' + esc(m.period) + '</td><td>' + esc(m.from) + '</td><td>' + esc(m.to) + '</td><td>' + (m.booking ? '<span class="chip warn">has a booking</span>' : m.why === 'permission' ? '<span class="chip">permission</span>' : '') + '</td></tr>'; }).join('') + '</table></details>';
    if (p.students.gone.length) out += '<details><summary class="small"><b>Withdrawals</b> (kept on file as “Not in roster”; their history stays)</summary>' + p.students.gone.map(function (g) { return '<div class="tiny">' + esc(g.name) + ' · ' + esc(g.sid) + '</div>'; }).join('') + (p.students.goneCount > p.students.gone.length ? '<div class="tiny mute">…and ' + (p.students.goneCount - p.students.gone.length) + ' more</div>' : '') + '</details>';

// CSV (our own reader, in slices so the page never freezes; progress as it goes) or Excel (SheetJS from cdnjs, loaded only for .xlsx)
function readTable(file, prog) {
  return new Promise(function (ok, no) {
    var rd = new FileReader();
    if (/\.xlsx?$/i.test(file.name)) {
      var go = function () { prog('Reading the Excel file…', -1); rd.onload = function () { setTimeout(function () { try { var wb = XLSX.read(new Uint8Array(rd.result), { type: 'array', cellDates: false }); ok(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, raw: false, defval: '' })); } catch (e) { no(e); } }, 30); }; rd.readAsArrayBuffer(file); };
      if (window.XLSX) return go();
      prog('Loading the Excel reader…', -1);
      var s = document.createElement('script'); s.src = 'https:' + '/' + '/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = go; s.onerror = function () { no(new Error('Couldn’t load the Excel reader. Save the file as CSV and try again.')); }; document.head.appendChild(s);
    } else { prog('Reading the file…', 0); rd.onload = function () { parseCSV(String(rd.result), prog).then(ok, no); }; rd.readAsText(file); }
  });
}
function parseCSV(text, prog) {
  return new Promise(function (ok) {
    text = text.replace(/^﻿/, '');
    var first = text.slice(0, text.indexOf('\n') + 1 || text.length), sep = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? '\t' : ',';
    var rows = [], row = [], cur = '', q = false, i = 0, L = text.length, STEP = 400000;
    var slice = function () {
      var end = Math.min(L, i + STEP), c;
      for (; i < end; i++) {
        c = text.charAt(i);
        if (q) { if (c === '"') { if (text.charAt(i + 1) === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
        else if (c === '"') q = true;
        else if (c === sep) { row.push(cur); cur = ''; }
        else if (c === '\n' || c === '\r') { if (c === '\r' && text.charAt(i + 1) === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
        else cur += c;
      }
      if (i < L) { if (prog) prog('Reading the file… ' + rows.length.toLocaleString() + ' rows', i / L); setTimeout(slice, 0); return; }
      if (cur || row.length) { row.push(cur); rows.push(row); }
      ok(rows);
    };
    slice();
  });
}
