// A copied Infinite Campus Schedule page → [{period, half, course, teacher}] (from the Resource Check-In parser).
// Each class line is "Course name LEVEL Last, First M/Last, First Room", followed (or preceded) by its "Period 05" line.
// A split lunch period ("SO Study A/Lunch B") becomes two rows, A and B.
function parseICSchedule(text) {
  var out = [], open = [], buf = [], pending = '';
  var perRe = /^(?:period|per\.?|pd\.?)\s*0*(\d+)\s*([AB])?(?![\w])|^0*(\d+)(?:st|nd|rd|th)\s+period\b/i;
  var classRe = [/^(.+?)\s+(L(?:IV|V|I{1,3}))\s+(.+?,.+?)(?:\s+([A-Z]{1,3}-[A-Z0-9]+))?$/, /^(.+?)\s+([A-Z]{2,3})\s+(.+?,.+?)(?:\s+([A-Z]{1,3}-[A-Z0-9]+))?$/];
  var close = function (per) { open.forEach(function (r) { r.period = per; out.push(r); }); open = []; };
  var tryClass = function () { for (var k = 1; k <= Math.min(4, buf.length); k++) { var line = buf.slice(buf.length - k).join(' '), m = classRe[0].exec(line) || classRe[1].exec(line); if (m && !/^\d{1,2}:\d\d/.test(m[1])) { buf = []; return m; } } return null; };
  String(text || '').replace(/ /g, ' ').split(/\r?\n/).forEach(function (raw) {
    var line = raw.replace(/\t+/g, ' ').trim(), m;
    if (!line) return;
    if ((m = perRe.exec(line))) { var per = String(+(m[1] || m[3])); buf = []; if (open.length) close(per); else pending = per; return; }
    buf.push(line); m = tryClass(); if (!m) return;
    var teacher = m[3].split('/').map(function (n) { var p = n.split(','); return ((p[1] || '').trim().split(/\s+/)[0] + ' ' + p[0].trim()).trim(); }).join(' / ');
    var name = m[1].trim(), split = /^(.+?)\s+A\s*\/\s*(.+?)\s+B$/.exec(name);
    if (split) [[split[1], 'A'], [split[2], 'B']].forEach(function (h) { open.push({ half: h[1], course: h[0], teacher: /lunch/i.test(h[0]) ? '' : teacher }); });
    else open.push({ half: '', course: name, teacher: teacher });
    if (pending) { close(pending); pending = ''; }
  });
  return out.filter(function (r) { return !/counsel|athlet|club/i.test(r.course); });
}
</script>

// ---------- the tracker: Booked → The Testing Center has the test → Arrived → Finished (or what went wrong)
function tchTrack(a) {

  // ---------- playing
