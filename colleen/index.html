<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow">

<title>Colleen's Quick Links</title><link rel="icon" type="image/png" sizes="512x512" href="../img/logo-512.png"><link rel="apple-touch-icon" href="../img/logo-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--bg:#F6F2EA;--card:#fff;--ink:#1B1E3C;--soft:#5A6185;--line:#E3D9CC;--blue:#2F6BFF;--red:#C7362E}
@media (prefers-color-scheme: dark){:root{--bg:#14162B;--card:#1F2240;--ink:#F3F1EC;--soft:#A9AECB;--line:#34385E;--blue:#7FA2FF;--red:#FF8A80}}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.45 Nunito,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:24px 16px 40px}
h1{font:600 clamp(28px,5vw,40px) Fredoka,system-ui,sans-serif;margin:0 0 4px}h2{font:600 21px Fredoka,system-ui,sans-serif;margin:22px 0 8px}
p{color:var(--soft);margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.q{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 12px;color:var(--ink);text-decoration:none;box-shadow:0 2px 10px rgba(60,40,20,.06)}
.q:hover{border-color:var(--blue)}.q .i{font-size:30px;line-height:1;flex:none;width:38px;text-align:center}.q b{display:block;font:600 18px Fredoka,system-ui,sans-serif}.q small{display:block;color:var(--soft);font-size:14px;line-height:1.3;margin-top:2px}
.cp{position:absolute;top:8px;right:8px;font:700 12px Nunito,system-ui,sans-serif;border:1px solid var(--line);background:var(--bg);color:var(--soft);border-radius:999px;padding:2px 9px;cursor:pointer;opacity:0;transition:opacity .15s}
.q:hover .cp,.q:focus-within .cp{opacity:1}@media (hover:none){.cp{opacity:1}}
.q{padding-bottom:40px}.inc{position:absolute;left:62px;bottom:9px;font:800 13px Nunito,system-ui,sans-serif;border:1px solid var(--ink);background:var(--ink);color:var(--bg);border-radius:999px;padding:3px 11px;cursor:pointer}.po{position:absolute;left:62px;bottom:9px;font:800 13px Nunito,system-ui,sans-serif;border:1px solid var(--line);background:var(--bg);color:var(--blue);border-radius:999px;padding:3px 11px;cursor:pointer}.po:hover{border-color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin:14px 0;max-width:520px}
form{display:flex;gap:8px;flex-wrap:wrap}input{font:inherit;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;flex:1 1 200px;min-width:0;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 20px;background:var(--blue);color:#fff;cursor:pointer}
.msg{min-height:22px;font-weight:700;color:var(--red)}.lock{background:none;color:var(--blue);padding:2px 4px}
.tip{font-size:14px;color:var(--soft);margin-top:26px}
[hidden]{display:none!important}
</style></head>
<body><main>
<h1>Colleen's Quick Links</h1>
<p>Everything you open every day, one click each.</p>
<div id="links"></div>
</main>
<script>
/* asl.cool/colleen (Colleen, 2026-10-17: "the things i want to have regular access to", for her Stream Deck too).
   Open, no password (Colleen); the asl.cool home page also shows it in her Full List, only with her admin password. */
(function () {
  var KIOSK = 'https:' + '//script.google.com/macros/s/AKfycbwUqOVMu6CzVjG9KVuD7DBlhNGYLGypZrHMwbp7z64WJgMb9YLCbM9OsjyTOVh5M0A/exec';
  var ASL = 'https:' + '//script.google.com/a/macros/d204.lths.net/s/AKfycbxzZdyNoOmmUBxph0wvG8q8lMPThIRy46lncYWGHxbzVB4I4WYTaMVACB9LVxXwAv4z/exec';
  var TC = 'https:' + '//script.google.com/a/macros/d204.lths.net/s/AKfycbxst_R-LWWYH6_lcO9J_lMGRmnw_k96eySqQ7oaR3iWRjt58NSF2lNP5zMe_NWhyRL8/exec';
  var SAYIT = 'https:' + '//colleenelyse.github.io/study-hall-sayit/';
  var SH = function (id) { return 'https:' + '//docs.google.com/spreadsheets/d/' + id + '/edit'; };
  var ON = /(^|\.)asl\.cool$/.test(location.hostname), SITE = ON ? '/' : '../';
  var GROUPS = [
    ['Every day', [
      ['🤟', 'ASL Study Hall', 'The class app. Teacher dashboard is inside.', ASL],
      ['🍎', 'Kiosk: Teacher view', 'Who’s here, who’s out, attendance, Tools.', KIOSK + '?view=teacher'],
      ['🚪', 'Kiosk: Student screen', 'The check-in screen by the door.', KIOSK],
      ['💺', 'Seating charts', 'Charts, groups and today’s check-ins.', KIOSK + '?view=seating'],
      ['🔥', 'Drill view', 'Who to account for in a drill.', KIOSK + '?view=drill'],
      ['📊', 'BASE/ARC Grade Check In', '', 'https:' + '//script.google.com/a/macros/d204.lths.net/s/AKfycby6TtScPayZdgkNLi7kzSHCUtEdMKu0lu7QtwmjCaRRhzHWrtjn_cumk9LaGI_pgJbr/exec']      // 2026-10-23 Colleen
    ]],
    ['Testing Center', [          // 2026-10-27 Colleen: the LTHS Testing Center app and its demo
      ['🧪', 'Testing Center app', 'Opens your teacher view (students get their own page).', TC],
      ['🔒', 'Testing Center: coordinator hub', 'The password-protected hub.', TC + '?hub=1'],
      ['📋', 'Testing Center tour (for administration)', 'Screenshots and what each person sees.', SITE + 'testing-center/'],
      ['🗂️', 'Testing Center demo: coordinator hub', 'Made-up students; nothing is saved.', SITE + 'testing-center/demo.html?as=coord'],
      ['🧑‍🏫', 'Testing Center demo: teacher view', '', SITE + 'testing-center/demo.html?as=teacher'],
      ['🎒', 'Testing Center demo: student view', '', SITE + 'testing-center/demo.html?as=student']
    ]],
    ['My Google Sheets', [          // 2026-10-28 Colleen: "links to all the google sheets i use"; each opens in the account that owns it
      ['🤟', 'ASL Study sheet', 'Units, students, Settings and the ASL Study menu. School account.', SH('1hA4KW-IZbgFBM1B55JjtZNZvYvKFcGNyTCK1F0EmCUE')],
      ['🍎', 'Hall Pass Kiosk sheet', 'Your own kiosk: students, schedules, check-ins.', SH('1ELmLByYjtTYs_W5eHtmWwhd3Z2POmQ6dx5jnEThISdo')],
      ['📗', 'Resource Grade Check-In', 'Your working copy, the one you use. School account.', SH('1CdvKWrWgFpWiUPLzcoT7SYY3oT-5_oBWh63a7A6q2_g')],
      ['📄', 'Resource Check-In: master template', 'The copy other teachers get. Keep its data tabs empty. School account.', SH('1WU4RGrF2-8yA13kAxJKjjMWFT6U4NMhZZPTJ72ywKOA')],
      ['🧪', 'Testing Center sheet', 'School account.', SH('1wMGPhEEMLXQbYtOfMM4qLUvOLYVn9l0qOitXX8hUaa0')],
      ['🚪', 'Hall Pass Kiosk: teacher template', 'The copy other teachers make.', SH('1rcyfhYnKIBjtcLud6nBlPPcGnAtTu-VtyACkMY_X0TE')],
      ['✋', 'TpT: ASL Spellbound', 'Selling account (jaqjoeyboutique).', SH('1CCssx__hY-n5ck04LPDClzj7_GYSov5EVh3c7dAEu1E')],
      ['📷', 'TpT: ASL Spellbound Plus', 'Selling account.', SH('1hjRFwz2LYZHntmtw7QBaYD6KSok8UVTNcL0OF8Zt4pU')],
      ['🔟', 'TpT: ASL Numberwise', 'Selling account.', SH('1Ey8KGJprufWM3MMHg-erZTD6k3MMuJL4BerEfcH6mOQ')],
      ['🔢', 'TpT: ASL Numberwise Plus', 'Selling account.', SH('1eW8yOZd7UPdmEF_vKmkolT8kIFcVqd-7cbZ2fnlwZOw')],
      ['📦', 'TpT: Spellbound & Numberwise', 'Selling account.', SH('1s4pODOYavenx6XjheF5azZ4zg0cLSUQZwIleH2IRGFI')],
      ['🌟', 'TpT: Everything edition', 'Selling account.', SH('15RUNtXCrHNlgRMX6zR3Yuyd0Cbgh_Gq8rFo6DKU196w')]
    ]],
    ['Projector', [
      ['📽️', 'Projector (with Freeze)', 'Best opened from the teacher view: 🧰 Tools > 📽️ Projector, so Freeze works from your monitor.', KIOSK + '?view=teacher'],
      ['🐠', 'Living Screensavers', 'In the teacher view: 🧰 Tools > 🐠 Living Screensavers.', KIOSK + '?view=teacher'],
      ['🐣', 'Class Sidekick (Pip)', 'Quiet-time buddy for the projector. Open it from ASL Study for rewards.', SAYIT + 'class.html'],
      ['🗣️', 'Say It', 'Big words on the screen.', SAYIT]
    ]],
    ['Class tools', [          // 2026-10-28: none of these opens the kiosk any more (Google wouldn't open it beside her school account): asl.cool/tools copies, the noise page, and ASL Study's picker and pass board
      ['⏱️', 'Timer', '', SITE + 'tools/?tool=timer'],
      ['🎲', 'Dice', '', SITE + 'tools/?tool=dice'],
      ['🎰', 'Name picker', 'In ASL Study, with your seating-chart classes.', ASL + '?view=picker'],
      ['🔢', 'Random number', '', SITE + 'tools/?tool=rnum'],
      ['🏆', 'Scoreboard', '', SITE + 'tools/?tool=score'],
      ['🔊', 'Noise meter', '', SITE + 'projector/noise.html'],
      ['🎫', 'Hall pass board', 'In ASL Study: who is out, from your kiosk.', ASL + '?view=passboard']
    ]],
    ['ASL practice', [
      ['🤟', 'Fingerspelling', 'Read fingerspelling from the 3D hand.', SITE + 'fingerspelling/'],
      ['🔢', 'Numbers', 'ASL numbers practice.', ON ? '/numbers/' : SITE + 'fingerspelling/?only=numbers'],
      ['📷', 'Sign to the camera', 'Fingerspell or sign numbers to the camera.', SITE + 'fingerspelling/reader.html'],
      ['👉', 'Pronoun Signs', 'ME, MY, YOU, YOUR on camera.', SITE + 'fingerspelling/pronouns.html'],
      ['🎱', 'Fingerspelling Bingo', '', SITE + 'fingerspelling/#/bingo'],
      ['🔎', 'WordSearch Studio', '', SITE + 'wordsearch/']
    ]],
    ['Game sounds', [
      ['🔊', 'Breach sounds', 'Listen to and change the music and sound effects for each moment of Breach.', ASL + '?view=brsounds']
    ]],
    ['Hearing and the Ear', [
      ['🦻', 'Hearing Loss Simulator', '', ON ? '/hearing/' : SITE + 'hear/hearing-loss-simulator.html'],
      ['🔊', 'Cochlear Implant Simulator', '', ON ? '/ci/' : SITE + 'hear/cochlear-implant-simulator.html'],
      ['👂', 'Parts of the Ear', 'Parts, labels and the ear quiz.', ON ? '/ear/' : SITE + 'hear/ear-quiz.html']
    ]],
    ['Reading warm-up', [
      ['🤔', 'Wait… But What Does That Mean?', 'Teacher view, for the projector.', SITE + 'wait/'],
      ['📝', 'Wait… (student link)', 'What students open.', SITE + 'wait-student/']
    ]],
    ['For students', [
      ['🏠', 'asl.cool home', 'What students see.', SITE],
      ['🎓', 'ASL Study Hall (student link)', 'Opens the class app.', SITE + 'study/'],
      ['🔑', 'Log into your school account', 'Help page for signing in.', SITE + 'login-help/']
    ]],
    ['Demo sites', [          // 2026-10-26: Colleen's demo and tour pages
      ['📊', 'Resource Check-In showcase', 'The tour for other teachers: screenshots and clickable demos.', SITE + 'resource/'],
      ['🧑‍🏫', 'Resource Check-In demo: teacher view', 'Four made-up students to click through.', SITE + 'resource/demo.html?as=teacher&demo=1&nobday'],
      ['🎒', 'Resource Check-In demo: student view', 'Marcus, a made-up student.', SITE + 'resource/demo.html?as=ort&demo=1&nobday'],
      ['🗂️', 'Resource Check-In demo: case manager view', 'Their students, then each full report.', SITE + 'resource/demo.html?as=cm&demo=1&nobday'],
      ['📽️', 'Resource Check-In practice page', 'For the projector: a new student’s first visit. Nothing is saved.', SITE + 'resource/practice.html'],
      ['🔑', 'Resource Check-In sign-in help', 'For students who can’t open the app.', SITE + 'resource/signin.html'],
      ['👪', 'ASL Study family tour', 'What families see about ASL Study.', SITE + 'tour/']
    ]],
    ['My shop and TpT', [
      ['🛍️', 'aslstudyhall.com', 'My Shopify store.', 'https:' + '//aslstudyhall.com/'],
      ['🍎', 'My TpT store', 'Jaq Joey Boutique.', 'https:' + '//www.teacherspayteachers.com/store/jaq-joey-boutique'],
      ['✋', 'ASL Spellbound (TpT copy)', 'What fingerspelling buyers get.', SITE + 'fs-tpt/'],
      ['🔟', 'ASL Numberwise (TpT copy)', 'What numbers buyers get.', SITE + 'num-tpt/'],
      ['📦', 'Bundle (TpT copy)', 'Fingerspelling and numbers together.', SITE + 'both-tpt/']
    ]],
    ['Behind the scenes', [
      ['🔐', 'asl.cool admin', 'Buttons, passwords, teacher links.', SITE + 'admin/'],
      ['🧪', 'ASL Study test link', 'The newest version before it\u2019s published.', 'https:' + '//script.google.com/a/macros/d204.lths.net/s/AKfycbxGGqXddAyMvRKnCmsHFVQd4Mfnl8VnEOA8mpiaRyk/dev'],
      ['🧪', 'Kiosk test link', 'The newest Kiosk before it\u2019s published. Needs your personal account: open it in a Chrome window signed in only to your personal Google account.', 'https:' + '//script.google.com/macros/s/AKfycbzRau547mRA4mQH0W3wHySQ6kSS2CmfIrJlqwTJt4c/dev?view=teacher'],
      ['🌐', 'School-safe copy of this page', 'For school, where asl.cool is blocked.', 'https:' + '//colleenelyse.github.io/asl-study-hall/colleen/'],
      ['📜', 'Credits', '', SITE + 'credits.html']
    ]]
  ];
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  function show() {
    var box = $('#links'); box.hidden = false;
    box.innerHTML = GROUPS.map(function (g) {
      return '<h2>' + esc(g[0]) + '</h2><div class="grid">' + g[1].map(function (t) {
        var abs = new URL(t[3], location.href).href;
        var inc = abs.indexOf(KIOSK) === 0 || /\/wait(-student)?\/$/.test(abs);      /* her personal-account apps: Google can't open them while she is also signed in to school (2026-10-28) */
        return '<a class="q" href="' + esc(abs) + '" target="_blank" rel="noopener"><span class="i" aria-hidden="true">' + t[0] + '</span><span><b>' + esc(t[1]) + '</b>' + (t[2] ? '<small>' + esc(t[2]) + '</small>' : '') + '</span><button class="cp" type="button" data-u="' + esc(abs) + '" title="Copy this link (for the Stream Deck)">Copy</button>' + (inc ? '<button class="inc" type="button" data-u="' + esc(abs) + '" title="Copies the link. Press ⌘ Shift N for an incognito window and paste it there.">🕶️ Incognito</button>' : '<button class="po" type="button" data-pop="' + esc(abs) + '" data-small="' + (g[0] === 'Class tools' ? 1 : '') + '" title="Open in its own window you can drag to the projector screen">⧉ Pop out</button>') + '</a>';
      }).join('') + '</div>';
    }).join('') + '<p class="tip"><b>🕶️ Incognito</b> marks your personal-account apps (the Kiosk pages and Wait…). Google can\u2019t open them while you\u2019re also signed in to your school account. Press 🕶️ Incognito to copy the link, press <b>⌘ Shift N</b>, paste and press Return. (Or right-click the card and choose <b>Open Link in Incognito Window</b>.) Everything else opens normally.</p><p class="tip"><b>⧉ Pop out</b> opens a tool in its own window: drag it onto the projector screen. Stream Deck: drag a <b>Website</b> action onto a key and paste a link from <b>Copy</b>. Each link opens straight to that page.</p>';
    box.onclick = function (e) {
      var po = e.target.closest('.po');
      if (po) {      /* its own small window (Colleen: open it on my monitor and slide it onto the projector screen) */
        e.preventDefault(); e.stopPropagation(); var sm = po.dataset.small, w = sm ? 560 : 1100, h = sm ? 460 : 720;
        var win = window.open(po.dataset.pop, 'pop' + Date.now(), 'popup=yes,width=' + w + ',height=' + h + ',left=' + Math.max(0, (screen.availWidth - w) / 2) + ',top=' + Math.max(0, (screen.availHeight - h) / 3));
        if (!win) alert('The pop-out window was blocked. Allow pop-ups for this page (the icon at the right end of the address bar), then press Pop out again.');
        return;
      }
      var ic = e.target.closest('.inc'); if (ic) { e.preventDefault(); e.stopPropagation(); (navigator.clipboard ? navigator.clipboard.writeText(ic.dataset.u) : Promise.reject()).then(function () { ic.textContent = 'Copied: ⌘ Shift N, then paste'; setTimeout(function () { ic.textContent = '🕶️ Incognito'; }, 3500); }, function () { prompt('Copy this link, then open an incognito window (⌘ Shift N) and paste it:', ic.dataset.u); }); return; }
      var b = e.target.closest('.cp'); if (!b) return; e.preventDefault(); e.stopPropagation();
      (navigator.clipboard ? navigator.clipboard.writeText(b.dataset.u) : Promise.reject()).then(function () { b.textContent = 'Copied ✓'; }, function () { prompt('Copy this link:', b.dataset.u); });
      setTimeout(function () { b.textContent = 'Copy'; }, 1500); };
  }
  show();
})();
</script>
</body></html>
