<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Study Hall Lite</title><link rel="icon" type="image/png" sizes="512x512" href="../img/logo-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@500;700;800&display=swap">
<!-- Study Hall Lite (Colleen 2026-10-28): "something quick and easy around to a few colleagues to try simply. the cells should accept text or gifs".
     No accounts and no Google Apps Script. A teacher pastes a two-column table (or a shared Google Sheet link), picks the games, and gets a student link.
     The cards travel inside the link (#d=…, compressed) or are read from the shared sheet (#s=…). Nothing is saved anywhere except personal bests in the browser.
     Games: Flashcards, Quiz, Matching, Neon Flying Toasters (Phaser; art from ../img/toasters/). Nothing ASL-specific: column A and B can each be words or a picture/GIF link. -->
<style>
:root { --bg: #F6F2EA; --ink: #1B1E3C; --mut: #5A6185; --line: #E3D9CC; --card: #fff; --acc: #2F6BFF; --ok: #12b886; --bad: #e03157 }
* { box-sizing: border-box } [hidden] { display: none !important }
body { margin: 0; background: var(--bg); color: var(--ink); font: 500 17px/1.5 Nunito, system-ui, sans-serif }
main { max-width: 1080px; margin: 0 auto; padding: 24px max(16px, env(safe-area-inset-left)) 48px }
h1 { font: 700 clamp(28px, 5vw, 40px) Fredoka, system-ui, sans-serif; margin: 0 0 4px } h2 { font: 600 22px Fredoka, system-ui, sans-serif; margin: 0 0 8px }
p { margin: 0 0 10px } .mut { color: var(--mut) } .small { font-size: 14px }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 18px; box-shadow: 0 2px 10px rgba(60, 40, 20, .06); margin: 14px 0 }
textarea, input[type=text] { width: 100%; font: inherit; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff }
textarea { min-height: 150px; font-size: 15px; white-space: pre; overflow-wrap: normal; overflow: auto }
button { font: inherit; font-weight: 800; border: 0; border-radius: 999px; padding: 10px 20px; background: var(--acc); color: #fff; cursor: pointer }
button.alt { background: #fff; color: var(--acc); box-shadow: inset 0 0 0 2px var(--acc) } button:disabled { opacity: .5; cursor: default }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.steps { margin: 0; padding-left: 22px } .steps li { margin: 4px 0 }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px }
.gpick { display: flex; gap: 10px; align-items: flex-start; border: 1.5px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; background: #fff }
.gpick input { margin-top: 5px; width: 18px; height: 18px } .gpick b { font: 600 18px Fredoka, sans-serif } .tag { display: inline-block; font-size: 12px; font-weight: 800; background: #EAF0FF; color: var(--acc); border-radius: 999px; padding: 1px 8px; margin-left: 4px }
.preview { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px } .pv { border: 1px solid var(--line); border-radius: 12px; padding: 6px; display: grid; grid-template-rows: 90px 90px; gap: 4px; background: #fff }
.m { display: grid; place-items: center; overflow: hidden; border-radius: 8px; background: #FBF8F2; text-align: center; font-weight: 800; line-height: 1.15; padding: 4px; min-height: 0 }
.m img { max-width: 100%; max-height: 100%; object-fit: contain; display: block }
.link { display: flex; gap: 8px; flex-wrap: wrap } .link input { flex: 1 1 260px; font-size: 14px }
.msg { min-height: 22px; font-weight: 700; color: var(--bad) } .good { color: var(--ok) }
.menu { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px }
.gbtn { text-align: left; background: #fff; color: var(--ink); border: 1.5px solid var(--line); border-radius: 18px; padding: 16px; display: grid; gap: 4px; box-shadow: 0 2px 10px rgba(60, 40, 20, .06) }
.gbtn:hover { border-color: var(--acc) } .gbtn b { font: 600 22px Fredoka, sans-serif } .gbtn span { color: var(--mut); font-weight: 600; font-size: 15px } .gbtn i { font-style: normal; font-size: 30px }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap } .back { background: none; color: var(--acc); padding: 4px 0 }
.seg { display: inline-flex; background: #fff; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px } .seg button { background: none; color: var(--mut); padding: 6px 14px } .seg button.on { background: var(--acc); color: #fff }
/* flashcards */
.fc { perspective: 1200px; max-width: 640px; margin: 10px auto } .fc-in { position: relative; aspect-ratio: 4 / 3; transition: transform .45s; transform-style: preserve-3d; cursor: pointer } .fc.flip .fc-in { transform: rotateY(180deg) }
.fc-side { position: absolute; inset: 0; backface-visibility: hidden; background: #fff; border: 1.5px solid var(--line); border-radius: 22px; box-shadow: 0 8px 26px rgba(60, 40, 20, .12); display: grid; place-items: center; padding: 18px; font: 700 clamp(26px, 5vw, 48px) Fredoka, sans-serif; text-align: center; overflow: hidden }
.fc-side.back { transform: rotateY(180deg); background: #FFFDF6 } .fc-side img { max-width: 100%; max-height: 100%; object-fit: contain }
/* quiz */
.q-ask { max-width: 640px; margin: 8px auto; aspect-ratio: 16 / 9; background: #fff; border: 1.5px solid var(--line); border-radius: 22px; display: grid; place-items: center; padding: 14px; font: 700 clamp(26px, 5vw, 46px) Fredoka, sans-serif; text-align: center; overflow: hidden }
.q-ask img { max-width: 100%; max-height: 100%; object-fit: contain } .q-opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 760px; margin: 10px auto }
.q-opt { background: #fff; color: var(--ink); border: 2px solid var(--line); border-radius: 16px; padding: 8px; min-height: 96px; display: grid; place-items: center; font-weight: 800; font-size: clamp(18px, 2.6vw, 26px); overflow: hidden }
.q-opt img { max-width: 100%; max-height: 150px; object-fit: contain } .q-opt.ok { border-color: var(--ok); background: #E6FCF5 } .q-opt.no { border-color: var(--bad); background: #FFF0F3 }
/* matching */
.mt { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px } .mt button { background: #fff; color: var(--ink); border: 2px solid var(--line); border-radius: 16px; min-height: 120px; padding: 6px; display: grid; place-items: center; font-weight: 800; overflow: hidden }
.mt button img { max-width: 100%; max-height: 130px; object-fit: contain } .mt button.sel { border-color: var(--acc); box-shadow: 0 0 0 3px #C9D8FF } .mt button.done { visibility: hidden } .mt button.no { border-color: var(--bad) }
.mt button.down .backf { font: 700 40px Fredoka, sans-serif; color: #C9BBA6 } .mt button .face { display: grid; place-items: center; width: 100%; height: 100% }
.ask { position: fixed; inset: 0; background: rgba(27, 30, 60, .45); display: grid; place-items: center; padding: 16px; z-index: 50 } .ask .card { max-width: 560px; width: 100% } .ask select { font: inherit; padding: 6px; border-radius: 8px; max-width: 100% }
.kinds { display: grid; gap: 8px } .kinds .gpick input { margin-top: 4px }
.spkbig { font-size: 24px; padding: 16px 30px }
.spk { position: absolute; top: 10px; right: 10px; background: #fff; color: var(--acc); box-shadow: inset 0 0 0 2px var(--acc); padding: 6px 12px; font-size: 20px; z-index: 2 } .q-ask { position: relative }      /* (.fc-side is already placed absolutely: making it relative squashed the flashcards) */
.mob-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 6px 0 } .strk { font-size: 26px; letter-spacing: 4px } .strk .on { filter: none } .strk .off { opacity: .2 }
.mob-bar { height: 10px; border-radius: 999px; background: #E9E1D4; overflow: hidden; margin: 6px 0 12px } .mob-bar i { display: block; height: 100%; background: linear-gradient(90deg, #FFC83D, #FF7A45); transition: width .2s linear } .mob-bar.low i { background: #e03157 }
.mob-grid { display: grid; grid-template-columns: repeat(20, 1fr); gap: 4px; max-width: 640px; margin: 12px auto } .mob-grid i { aspect-ratio: 1; border-radius: 4px; background: #2F6BFF; transition: background .4s, transform .4s } .mob-grid i.out { background: #E3D9CC } .mob-grid i.zap { animation: zap .6s } .mob-grid i.rise { animation: rise .6s } @keyframes zap { 50% { transform: scale(1.5); background: #e03157 } } @keyframes rise { 50% { transform: scale(1.5); background: #12b886 } }
.theone { text-align: center; background: linear-gradient(135deg, #1B1E3C, #3B2A7A); color: #fff; border-radius: 22px; padding: 26px 18px; margin: 10px 0 } .theone h2 { font-size: clamp(28px, 6vw, 46px); margin: 6px 0; color: #FFC83D }
.fate { text-align: center; font-weight: 800; font-size: 20px; border-radius: 16px; padding: 12px; margin: 8px 0 } .fate.safe { background: #E6FCF5; color: #087f5b } .fate.out { background: #FFF0F3; color: #c2255c }
.big { font: 700 clamp(22px, 4vw, 34px) Fredoka, sans-serif; text-align: center; margin: 10px 0 }
/* flying toasters */
.tt-stage { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #05030f; box-shadow: 0 0 0 2px #3b1d6e, 0 10px 40px rgba(120, 40, 255, .35); touch-action: none; user-select: none; -webkit-user-select: none }
.tt-stage canvas { display: block; width: 100% !important; height: 100% !important } .tt-ov { position: absolute; inset: 0; pointer-events: none }
.tt-c { position: absolute; width: 17.5%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 10%; overflow: hidden; background: #fff; box-shadow: 0 0 0 .3vmin #ffd36b, 0 0 1.6vmin rgba(255, 190, 80, .9); transition: opacity .3s, filter .3s, transform .25s, box-shadow .25s; display: grid; place-items: center; container-type: inline-size; text-align: center; color: #1B1E3C; font: 700 16px/1.1 Fredoka, sans-serif; padding: 6%; overflow-wrap: break-word }
.tt-c img { position: absolute; inset: 5%; width: 90%; height: 90%; object-fit: contain } .tt-c.sm { width: 13% } .tt-c.gone { opacity: 0 }
.tt-c.prompt { width: 19%; background: #160f2e; color: #fff; box-shadow: 0 0 0 .4vmin #ff2bd6, 0 0 2.4vmin #ff2bd6 } .tt-c.prompt.sm { width: 16% }
.tt-c.right { transform: translate(-50%, -50%) scale(1.25); box-shadow: 0 0 0 .6vmin #3dffc5, 0 0 4vmin #3dffc5 } .tt-c.reveal { box-shadow: 0 0 0 .6vmin #3dffc5, 0 0 4vmin #3dffc5 }
.tt-c.wrong { filter: grayscale(1) brightness(.55); transform: translate(-50%, -50%) rotate(-8deg) scale(.9); box-shadow: 0 0 0 .6vmin #ff3b5c, 0 0 3vmin #ff3b5c }
.tt-panel { position: absolute; inset: 0; display: flex; align-items: safe center; justify-content: center; background: rgba(5, 3, 15, .74); color: #fff; text-align: center; padding: 2% 3%; overflow-y: auto }
.tt-panel > div { max-width: 640px; display: flex; flex-direction: column; gap: 10px; align-items: center } .tt-panel h2 { color: #ff6ee7; text-shadow: 0 0 12px #ff2bd6; font-size: clamp(22px, 4vw, 38px); margin: 0 }
.tt-panel img.logo { width: min(46vw, 320px) } .tt-opts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center } .tt-opts button { padding: 6px 14px; opacity: .6 } .tt-opts button.on { opacity: 1; box-shadow: 0 0 0 3px #3dffc5 }
/* Treasure Island (copied from ASL Study, her art from ../img/isle/) */
:root { --display: Fredoka, system-ui, sans-serif }
.sx-me { background: rgba(8,39,61,.8); padding: 4px 12px; border-radius: 999px; font-weight: 800 } .sx-big { font: 800 clamp(18px, 3vw, 26px) var(--display); margin: 6px 0 2px; text-shadow: 0 2px 4px rgba(0,0,0,.5) } .sx-sub { margin: 0 0 10px; background: rgba(8,39,61,.7); padding: 6px 10px; border-radius: 10px }
.sx-arsbox { display: flex; align-items: center; gap: 10px; background: linear-gradient(135deg, #0b4f8a, #0f6c97); color: #fff; border-radius: 12px; padding: 8px 12px } .sx-arsbox img { width: 40px; height: 40px } .sx-arsbox b { font: 800 1.2rem var(--display) } .sx-arsbox small { display: block; opacity: .85 }
.sx-result { margin: 0; padding: 10px 12px; border-radius: 12px; text-align: center; font: 900 1.3rem var(--display); color: #fff; animation: sxpop .45s ease-out } .sx-result.hit { background: #c5221f } .sx-result.miss { background: #0f6c97 } .sx-result.small { font-size: .95rem; padding: 6px 10px; margin-bottom: 6px } .sx-firebtn { width: 100%; font-size: 1.2rem; min-height: 54px; animation: sxpop .35s ease-out }
.ti { border-radius: 18px; padding: 14px; color: #fff; background: #2fb4c9 url('https://colleenelyse.github.io/asl-study-hall/img/isle/island-background-sm.jpg?v=1') center / cover; min-width: 0 } .ti-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px } .ti-head h2 { margin: 0; text-shadow: 0 2px 4px rgba(0,0,0,.4) } .ti-stat { margin-left: auto; background: rgba(60,35,10,.75); padding: 4px 12px; border-radius: 999px; font-weight: 800 }
.ti-grid { display: grid; grid-template-columns: 1.4em 1fr; grid-template-rows: 1.4em auto; max-width: 620px; margin: 8px auto 0 } .ti-labs { display: grid } .ti-labs.top { grid-template-columns: repeat(var(--w), 1fr) } .ti-labs.side { grid-template-rows: repeat(var(--h), 1fr) } .ti-labs b { display: grid; place-items: center; color: #fff; font: 800 .8rem var(--display); text-shadow: 0 1px 3px #000 }
.ti-sand { display: grid; grid-template-columns: repeat(var(--w, 12), 1fr); gap: 2px; padding: 6px; border-radius: 14px; background: rgba(226,189,108,.55); border: 4px solid #8a5a2b } .ti-cell { aspect-ratio: 1; border: 0; border-radius: 6px; padding: 0; font-size: clamp(10px, 2vw, 20px); display: grid; place-items: center; cursor: pointer; box-shadow: inset 0 -3px 0 rgba(0,0,0,.12) }
.ti-cell.d0, .ti-cell.d1, .ti-cell.d2, .ti-cell.d3 { background: center / cover no-repeat; box-shadow: none } .ti-cell.d0 { background-image: url('https://colleenelyse.github.io/asl-study-hall/img/isle/patch-0.png?v=1') } .ti-cell.d1 { background-image: url('https://colleenelyse.github.io/asl-study-hall/img/isle/patch-1.png?v=1') } .ti-cell.d2 { background-image: url('https://colleenelyse.github.io/asl-study-hall/img/isle/patch-2.png?v=1') } .ti-cell.d3 { background-image: url('https://colleenelyse.github.io/asl-study-hall/img/isle/patch-3.png?v=1'); cursor: default }      /* 4.48: Colleen's sand patches */
.ti-cell { position: relative } .ti-cell.sel { transform: scale(1.06); z-index: 1 } .ti-cell.sel::after { content: ''; position: absolute; inset: -4%; background: url('https://colleenelyse.github.io/asl-study-hall/img/isle/patch-selected.png?v=1') center / 100% 100% no-repeat; pointer-events: none } .ti-cell.mine { outline: 3px solid #fff; outline-offset: -2px; animation: sxpick 1s infinite } .ti-cell.held { outline: 3px solid var(--tc); outline-offset: -3px } .ti-cell.x::before { content: '✖'; position: absolute; top: 3%; right: 7%; font: 900 clamp(9px, 1.3vw, 15px) / 1 system-ui, sans-serif; color: #d42a1e; text-shadow: 0 0 2px #fff; pointer-events: none }      /* 4.65 (Colleen): crossed-off squares still look like sand you can dig */
.ti-cell.xspot { z-index: 1; outline: 4px solid #ffd400; outline-offset: -2px; box-shadow: 0 0 0 3px #ffd400, 0 0 14px 4px #ffd400; animation: tixspot 1.6s ease-in-out infinite } .ti-cell.xspot::before { content: '✖'; position: absolute; inset: 0; display: grid; place-items: center; font: 900 clamp(20px, 3.2vw, 40px) / 1 system-ui, sans-serif; color: #d42a1e; text-shadow: 0 0 3px #fff, 0 0 6px #fff; pointer-events: none } @keyframes tixspot { 50% { box-shadow: 0 0 0 3px #ffd400, 0 0 22px 8px #ffd400 } } @media (prefers-reduced-motion: reduce) { .ti-cell.xspot { animation: none } }
.ti-key { position: relative; z-index: 2; margin: 6px auto 0; width: fit-content; max-width: 100%; box-sizing: border-box; font-size: .9rem; text-align: center; background: rgba(20,14,6,.82); color: #fff3d6; border-radius: 10px; padding: 4px 10px } .ti-key.spot { background: #7a1610; color: #fff; border: 2px solid #ffd400 } .ti-key b.red { color: #d42a1e } .ti-key.spot { font-weight: 800; font-size: 1.02rem } .ti-cell.leg { background: #ffe27a !important; box-shadow: 0 0 12px #ffd400 } .ti-cell.fresh { animation: sxpop .5s ease-out }
.ti .sb-msg { background: rgba(60,35,10,.78); padding: 6px 10px; border-radius: 10px; min-height: 0; margin: 6px 0 } .ti-acts .btn { min-height: 50px } .ti-intro { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; padding: 22px } .ti-intro #tspick { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100% } .ti-lens { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center } .ti-len { display: flex; flex-direction: column; gap: 2px; padding: 12px 18px; border-radius: 14px; border: 3px solid #fff; background: rgba(60,35,10,.75); color: #fff; font: 800 1.1rem var(--display); cursor: pointer } .ti-len small { font: 600 .8rem var(--body, inherit); opacity: .9 } .ti-len.on { background: #ffd400; color: #3b2a05 }
.ti-lbbox { background: rgba(60,35,10,.78); border-radius: 14px; padding: 10px 16px; width: min(100%, 420px); text-align: left } .ti-lbbox h3 { margin: 0 0 6px; font-size: 1rem } .ti-lb { margin: 0; padding-left: 1.6em; display: grid; gap: 3px } .ti-lb li span { display: inline-block; min-width: 8em } .ti-lb li.me { color: #ffd400; font-weight: 800 } .ti-ic { width: 1.4em; height: 1.4em; object-fit: contain; vertical-align: middle; display: inline-block; text-align: center } .ti-ic.big { width: 2.2em; height: 2.2em } .ti-ban { width: min(90%, 420px); height: auto; animation: sxpop .5s ease-out } .ti-bigban { width: 48%; height: auto; animation: sxpop .5s ease-out } .ti-winban { position: absolute; left: 50%; top: 14%; width: 34%; transform: translateX(-50%); z-index: 13; animation: sxpop .5s ease-out } .sx-result.gold { background: #b8860b } .ti-feed li.other { background: rgba(60,35,10,.7) } .ti-big { font-size: 34px } .ti-dim { opacity: .35; pointer-events: none }
.ti-dig { display: flex; gap: 14px; align-items: stretch; justify-content: center; flex-wrap: wrap; width: 100% } .ti-digside { display: flex; flex-direction: column; align-items: center; gap: 8px; max-width: 260px }
.ti-hole { display: flex; flex-direction: column; align-items: center; gap: 4px } .ti-dirt { position: relative; width: 110px; height: 340px; background: url('https://colleenelyse.github.io/asl-study-hall/img/isle/hole-dig.png?v=1') center / 100% 100% no-repeat; overflow: visible }      /* 4.50: Colleen's hole; packed sand fills what isn't dug yet */
.ti-dirt > i { position: absolute; left: 17%; right: 17%; bottom: 3%; border-radius: 6px 6px 10px 10px; background: radial-gradient(circle at 30% 20%, rgba(255,255,255,.18) 0 2px, transparent 3px) 0 0 / 14px 14px, linear-gradient(#e7c27a, #c9964f 50%, #9c6c34); box-shadow: inset 0 3px 0 rgba(255,240,200,.6); transition: top .25s }
.ti-mark { position: absolute; left: 50%; transform: translate(-50%, -50%); width: 46px; height: 46px; display: grid; place-items: center; background: rgba(255,255,255,.25); border-radius: 50%; filter: grayscale(.8) brightness(.8); font-size: 26px } .ti-mark .ti-ic { width: 36px; height: 36px } .ti-mark.got { filter: none; background: #ffe27a; box-shadow: 0 0 14px #ffd400; animation: sxpop .4s ease-out } .ti-mark.mega { width: 54px; height: 54px } .ti-pct { font: 900 1.2rem var(--display) } .ti-first { margin: 0; font-weight: 800; color: #ffe27a }
.ti-holes { display: flex; gap: 3cqw; align-items: flex-end } .ti-holecol { display: flex; flex-direction: column; align-items: center; gap: .6cqw; font: 800 1.8cqw var(--display) } .ti-holecol .ti-dirt { width: 6.5cqw; height: 22cqw; filter: drop-shadow(0 0 .4cqw var(--tc)) drop-shadow(0 0 .2cqw var(--tc)) } .ti-holecol .ti-mark { width: 3cqw; height: 3cqw; font-size: 1.8cqw } .ti-holecol .ti-mark .ti-ic { width: 2.4cqw; height: 2.4cqw } .ti-holecol .ti-pct { font-size: 1.6cqw } .ti-got .ti-ic { width: 3cqw; height: 3cqw }
.ti-rush { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding: 10px; background: rgba(60,35,10,.55); border-radius: 16px } .ti-nugget { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: clamp(60px, 10vw, 110px); line-height: 1; border: 0; background: radial-gradient(circle, #ffe27a 0%, #f5b700 60%, #b8860b 100%); border-radius: 50%; width: 1.5em; height: 1.5em; cursor: pointer; box-shadow: 0 8px 0 #7a5a00, 0 0 30px #ffd400; touch-action: manipulation; user-select: none } .ti-nugget small { font: 900 .3em var(--display) } .ti-nugget img { width: 55%; height: 55%; object-fit: contain; pointer-events: none } .ti-shovel { width: 44px; height: 44px; object-fit: contain } .ti-cell .ti-ic { width: 80%; height: 80% } .ti-nugget.pop { animation: tipop .12s ease-out } @keyframes tipop { 50% { transform: scale(.92) } } .ti-taps { font: 900 2rem var(--display); margin: 0 }
.tip { position: relative; aspect-ratio: 16 / 9; width: 100%; border-radius: 18px; overflow: hidden; background: #2fb4c9 url('https://colleenelyse.github.io/asl-study-hall/img/isle/island-background.jpg?v=1') center / cover; color: #fff; container-type: inline-size }
.sb-msg { margin: 0; font-weight: 700; color: #ffe27a }

/* ───────── start: a link with a set opens the games; otherwise the setup page ───────── */
(async () => {
  const p = new URLSearchParams(location.hash.slice(1));
  if (location.hash === '#guide') return guide();
  if (!p.get('d') && !p.get('s')) return setup();
  FLIP = p.get('q') === 'b'; META = { t: p.get('t') || 'Study set', g: (p.get('g') || 'flash,quiz,match,toast').split(','), key: '', la: p.get('la') || '', lb: p.get('lb') || '', chk: p.get('chk') === '1' };
  try { CARDS = p.get('s') ? await readSheet(p.get('s'), p.get('gid') || '') : await unpack(p.get('d')); }
  catch (e) { app.innerHTML = `<h1>Study Hall Lite</h1><p class="msg">This set could not be opened. ${esc(e.message || '')}</p>`; return; }
  CARDS = CARDS.filter(c => c && c[0] && c[1]); META.key = String(CARDS.length) + ':' + (CARDS[0] ? CARDS[0][0] : '').slice(0, 20);
  if (CARDS.length < 2) { app.innerHTML = '<h1>Study Hall Lite</h1><p class="msg">This set needs at least 2 cards.</p>'; return; }
  menu();
