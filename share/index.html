<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" type="image/png" sizes="64x64" href="../img/logo-64.png"><link rel="icon" type="image/png" sizes="32x32" href="../img/logo-32.png"><link rel="apple-touch-icon" href="../img/logo-180.png"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASL Study Hall</title><meta name="robots" content="noindex, nofollow"><meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&family=Nunito:wght@500;700&display=swap">
<style>body{margin:0;background:#F6F2EA;color:#1B1E3C;font:500 17px/1.5 Nunito,system-ui,sans-serif}main{max-width:1280px;margin:0 auto;padding:32px 16px}
h1{font:600 clamp(30px,6vw,44px) Fredoka,system-ui,sans-serif;margin:0 0 6px}h2{font:600 22px Fredoka,system-ui,sans-serif;margin:0 0 8px}p{color:#5A6185}
.card{background:#fff;border:1px solid #E3D9CC;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 2px 10px rgba(60,40,20,.06)}
#tools:has(a.tool){display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin:14px 0}#tools a.tool{margin:0}
a.tool{display:block;background:#fff;border:1px solid #E3D9CC;border-radius:18px;padding:20px;margin:14px 0;color:#1B1E3C;text-decoration:none;box-shadow:0 2px 10px rgba(60,40,20,.06)}
a.tool:hover{border-color:#2F6BFF}a.tool b{font:600 22px Fredoka,system-ui,sans-serif;display:block}
form{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{font:inherit;padding:10px 14px;border:1.5px solid #E3D9CC;border-radius:12px;min-width:0;flex:1 1 200px}
button{font:inherit;font-weight:800;border:0;border-radius:999px;padding:10px 20px;background:#2F6BFF;color:#fff;cursor:pointer}
.msg{min-height:24px;margin:8px 0 0;font-weight:700;color:#C7362E}.lock{background:none;color:#2F6BFF;padding:2px 4px;font-weight:700}.foot{text-align:center;font-size:14px;color:#5A6185;margin-top:24px}.foot a{color:#2F6BFF}</style><!-- temporary: shop links hidden until the school approves the domain --> <style>[data-shop]{display:none!important}body.shopok [data-shop]{display:revert!important}</style><script>try{if(localStorage.getItem('aslNoShop'))document.documentElement.classList.add('noshop')}catch(e){}</script></head>
<body><main><p style="text-align:right;margin:0 0 8px"><a data-shop href="https://aslstudyhall.com" target="_blank" rel="noopener" style="display:inline-block;font:800 16px/1 system-ui,sans-serif;color:#1B1E3C;background:#FFC83D;border-radius:999px;padding:10px 18px;box-shadow:0 2px 6px rgba(60,40,20,.15);text-decoration:none;white-space:nowrap">🛍️ Shop ASL Study Hall</a> <a data-shop href="https://www.teacherspayteachers.com/store/jaq-joey-boutique" target="_blank" rel="noopener" style="display:inline-block;font:800 16px/1 system-ui,sans-serif;color:#1B1E3C;background:#FFC83D;border-radius:999px;padding:10px 18px;box-shadow:0 2px 6px rgba(60,40,20,.15);text-decoration:none;white-space:nowrap">🛒 Shop on TpT</a></p>
<h1>🤟 ASL Study Hall</h1>
<p>Free ASL and Deaf studies activities, shared with you by an ASL teacher. Pick one to start.</p>
<div id="tools"><p>Loading…</p></div>
<p class="foot"><a href="/credits.html">Credits and sources</a></p>
<script>
/* asl.cool/t/<code>: a list Colleen shares with one teacher or group (she picks the buttons in /admin; the code cannot be guessed). */
/* the products: Colleen's picks in admin (asl.cool/products.json), or else every product in her Shopify store, read straight from Shopify
   (aslstudyhall.com/products.json allows this): picture, name, price, description, link to the product on aslstudyhall.com */
async function aslProducts() {
  const strip = h => { const d = document.createElement('div'); d.innerHTML = String(h || ''); return (d.textContent || '').replace(/\s+/g, ' ').trim(); };
  try { const r = await fetch('/products.json', { cache: 'no-store' }); if (r.ok) { const d = await r.json(); if (d.source === 'admin' && d.products && d.products.length) return d.products; } } catch (e) {}
  try { const r = await fetch('https:' + '/' + '/aslstudyhall.com/products.json?limit=50'); if (r.ok) return ((await r.json()).products || []).map(x => { const v = (x.variants || [])[0] || {}, img = (x.images || [])[0];
    return { title: x.title || '', price: v.price ? '$' + (+v.price).toFixed(2) : '', img: img && img.src ? img.src : '', desc: strip(x.body_html).slice(0, 180), link: 'https:' + '/' + '/aslstudyhall.com/products/' + x.handle }; }); } catch (e) {}
  return [];
}
(async function () {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const code = (location.pathname.match(/^\/t\/([a-z0-9]{8,16})\/?$/) || [])[1], box = document.getElementById('tools');
  const off = () => { box.innerHTML = '<div class="card"><h2>This link is not active</h2><p>Ask the teacher who shared it for a new one.</p></div>'; };
  if (!code) return off();
  try {
    const r = await fetch('/share.json?c=' + code, { cache: 'no-store' }); if (!r.ok) return off(); const d = await r.json();
    const nice = v => { const [y, m, dd] = String(v).split('-').map(Number); return new Date(y, m - 1, dd).toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' }); };
    if (d.notyet) { box.innerHTML = '<div class="card"><h2>This link opens soon</h2><p>It starts on ' + esc(nice(d.notyet)) + '. Come back then!</p></div>'; return; }
    if (d.ended) { box.innerHTML = '<div class="card"><h2>This preview has ended</h2><p>Thanks for trying ASL Study Hall! To keep using the games with your classes, get your own copy:</p>' +
      '<p><a class="tool" href="https:' + '//aslstudyhall.com" target="_blank" rel="noopener"><b>🛍️ ASL Study Hall shop</b>aslstudyhall.com</a><a class="tool" href="https:' + '//www.teacherspayteachers.com/store/jaq-joey-boutique" target="_blank" rel="noopener"><b>🍎 Teachers Pay Teachers</b>ASL Spellbound and ASL Numberwise</a></p></div>'; return; }      /* Colleen's passes (2026-10-17) */
    if (!d.tools || !d.tools.length) return off();
    if (d.shop) document.body.classList.add('shopok');
    document.documentElement.classList.toggle('noshop', !d.shop); try { d.shop ? localStorage.removeItem('aslNoShop') : localStorage.setItem('aslNoShop', '1'); } catch (e) {}      // this teacher link shows Colleen's shop (Show the shop ticked in admin)
    if (d.end) box.insertAdjacentHTML('beforebegin', '<p style="font-weight:700">This link works through ' + esc(nice(d.end)) + '.</p>');
    box.innerHTML = d.tools.map(t => '<a class="tool" href="' + esc(/^https?:/i.test(t.href) ? t.href : '/' + t.href.replace(/^\//, '')) + '"><b>' + esc((t.icon ? t.icon + ' ' : '') + t.title) + '</b>' + esc(t.desc || '') + '</a>').join('');
    if (d.shop) { const pr = await aslProducts(); if (pr.length) box.insertAdjacentHTML('afterend', '<div class="card"><h2>From the ASL Study Hall Shop</h2>' + pr.map(x => '<a class="tool" href="' + esc(x.link) + '" target="_blank" rel="noopener">' + (x.img ? '<img src="' + esc(x.img) + '" alt="" style="width:96px;height:96px;object-fit:cover;border-radius:10px;float:right;margin-left:12px">' : '') + '<b>' + esc(x.title) + (x.price ? ' · ' + esc(x.price) : '') + '</b>' + esc(x.desc || '') + '<span style="display:block;clear:both"></span></a>').join('') + '</div>'); }
  } catch (e) { box.innerHTML = '<p>Could not load the list. Check the internet connection and reload.</p>'; }
})();
</script>
</main></body></html>
