<style>
/* Layout: one phone-width column of soft rounded surfaces. Sticker treatment (ink outline, hard drop) is kept for
   the things you press and the characters you collect, so they stand out from the calm page around them. */
:root {
  --bg: #F1F4FA; --surface: #FFFFFF; --surface2: #E6EBF5; --ink: #1B1E3C; --muted: #5A6185; --line: #D5DCEB;
  --accent: #2F6BFF; --accent-ink: #FFFFFF; --sun: #FFC83D; --sun-ink: #3A2A00;
  --good: #14804D; --good-soft: #DCF4E7; --bad: #C7362E; --bad-soft: #FBE3E1; --outline: #1B1E3C; --wood: #C98A4B;
  --st-learn: #E5484D; --st-fam: #F5B700; --st-mast: #1F9D55;
  --shadow: 0 1px 2px rgba(27,30,60,.06), 0 8px 22px rgba(27,30,60,.07);
  --display: "Fredoka", "Trebuchet MS", "Segoe UI", sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --accent-soft: color-mix(in srgb, var(--accent) 14%, var(--surface));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11132A; --surface: #1B1E3E; --surface2: #272B52; --ink: #F0F2FF; --muted: #A6ACCD; --line: #343A6B;
  --accent: #4C7DFF; --accent-ink: #FFFFFF; --sun: #FFD25E; --sun-ink: #3A2A00;
  --good: #5AD79A; --good-soft: #163B2B; --bad: #FF8A82; --bad-soft: #4A2020; --outline: #07081A; --wood: #8A5A2B;
  --st-learn: #FF6B6B; --st-fam: #FFD25E; --st-mast: #4FD08F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11132A; --surface: #1B1E3E; --surface2: #272B52; --ink: #F0F2FF; --muted: #A6ACCD; --line: #343A6B;
  --accent: #4C7DFF; --accent-ink: #FFFFFF; --sun: #FFD25E; --sun-ink: #3A2A00;
  --good: #5AD79A; --good-soft: #163B2B; --bad: #FF8A82; --bad-soft: #4A2020; --outline: #07081A; --wood: #8A5A2B;
  --st-learn: #FF6B6B; --st-fam: #FFD25E; --st-mast: #4FD08F;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.28); color-scheme: dark }
/* shop themes are applied from the THEMES table in the script: accent, page colors and a faint picture pattern */

* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { margin: 0 }
/* a theme's backdrop picture sits on its own fixed layer behind everything, so it fills the screen and stays put while the page scrolls */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none; background-image: var(--deco, none); background-size: cover; background-position: center; background-repeat: no-repeat }
body { background-color: var(--bg); color: var(--ink); font: 500 16px/1.45 var(--body); -webkit-tap-highlight-color: transparent }
#app { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 96px; min-height: 100% }
#app.ingame { padding-block: 12px 24px }
/* big screens: the browsing pages (Home, Shop, Me) use the width; games and lists stay in a readable column */
@media (min-width: 1000px) {
  #app.wide:not(.ingame) { max-width: min(1280px, 94vw) }
  #app.wide.ingame { max-width: min(1500px, 96vw) }   /* the projector board uses the screen */
  #app:not(.wide):not(.ingame) { max-width: 860px }
  .home { display: grid !important; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 22px; align-items: start }
  .even { grid-template-columns: repeat(var(--cx, var(--cw, 3)), minmax(0, 1fr)) !important }
  .me2 { column-count: 2; column-gap: 22px; display: block !important } .me2 > * { break-inside: avoid; margin-bottom: 16px }
}
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.15 }
h1 { font-size: 1.75rem } h2 { font-size: 1.25rem } h3 { font-size: 1.05rem }
p { margin: 0 }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
.muted { color: var(--muted) } .small { font-size: .875rem } .num { font-variant-numeric: tabular-nums }
.eyebrow { font: 800 .75rem/1 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.stack { display: flex; flex-direction: column; gap: 16px }
.row { display: flex; align-items: center; gap: 12px } .row > .grow { flex: 1; min-width: 0 }
.wrap { display: flex; flex-wrap: wrap; gap: 8px }
.card { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 16px }
svg.ic { width: 1.25em; height: 1.25em; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 20px; border-radius: 14px;
  border: 2px solid var(--outline); background: var(--accent); color: var(--accent-ink); font: 600 1.05rem var(--display);
  box-shadow: 0 4px 0 var(--outline); transition: transform .06s, box-shadow .06s }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--outline) }
.btn.alt { background: var(--surface); color: var(--ink) } .btn.sun { background: var(--sun); color: var(--sun-ink) }
.btn.wide { width: 100% } .btn.sm { min-height: 40px; padding: 6px 14px; font-size: .95rem; box-shadow: 0 3px 0 var(--outline) }
.btn[disabled] { opacity: .55; cursor: not-allowed; box-shadow: 0 2px 0 var(--outline) }
.link { background: none; border: 0; padding: 6px 4px; color: var(--accent); font-weight: 800; text-decoration: underline; text-underline-offset: 3px }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface2); display: grid; place-items: center; flex: none }

.chip.flat { box-shadow: none; background: var(--surface2) } .chip.sel { background: var(--accent); color: var(--accent-ink) }
.chip .ic { color: var(--accent) } .chip.fire .ic { color: #E8590C }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font: 800 .72rem/1.6 var(--body); letter-spacing: .05em; text-transform: uppercase; background: var(--surface2); color: var(--muted) }
.pill.rare { background: var(--accent-soft); color: var(--accent) } .pill.legendary { background: var(--sun); color: var(--sun-ink) }
.qrgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px } .qrrep { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px } .qrrep h3 { margin: 0 0 6px; font-size: 1rem } .qrrep ul { margin: 0; padding-left: 18px; display: grid; gap: 3px } @media print { .qrreport ~ .qrunit { display: none } }
.qrrow { padding: 14px 16px } .qrrow summary { list-style: none; cursor: pointer } .qrrow summary::-webkit-details-marker { display: none } .qrrow[open] summary { margin-bottom: 10px }
.qrbar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; margin-top: 8px } .qrbar i { display: block; height: 100% }
.qrterm { font-size: 1.08rem } .qrhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; padding: 0 4px } .qrh2 { border-bottom: 2px solid var(--line); padding-bottom: 6px; margin-top: 10px } .qrh2 h2 { font-size: 1.35rem } .qrh3 h3 { font-size: 1.05rem; color: var(--muted) } .qrunit { margin-bottom: 8px } .qrwho { width: 100%; border-collapse: collapse; font-size: .9rem } .qrwho th, .qrwho td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line) } .qrwho th { font-size: .75rem; text-transform: uppercase; color: var(--muted) }
.sbgrid { display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: 14px } @media (max-width: 640px) { .sbgrid { grid-template-columns: repeat(min(var(--cols), 2), 1fr) } }

.sbhalf span { background: rgba(255, 255, 255, .22); border-radius: 999px; padding: 2px 14px } .sbhalf.down span { background: rgba(0, 0, 0, .22) } .sbhalf.up:active { background: rgba(255, 255, 255, .16) } .sbhalf.down:active { background: rgba(0, 0, 0, .3) } .sbhalf:focus-visible { outline: 4px solid #fff; outline-offset: -8px }

.sbname { font: 800 clamp(1rem, 9cqw, 2.4rem)/1.1 var(--body); overflow-wrap: anywhere; display: flex; gap: 6px; align-items: center; justify-content: center } .sbcrown { font-size: 1.1em }

.sbpop { position: absolute; top: 40%; left: 50%; transform: translate(-50%, 0); font: 800 clamp(1.4rem, 14cqw, 4rem) var(--display); color: #fff; pointer-events: none; animation: sbpop 1.05s ease-out forwards; z-index: 2; text-shadow: 0 2px 6px rgba(0, 0, 0, .35) } .sbpop.neg { color: #FFE0E0 }

.sbdot { width: 18px; height: 18px; border-radius: 50%; flex: none } .sbchips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center } .sbcustom { display: flex; align-items: center; gap: 6px; font: 700 .85rem var(--body) } .sbcustom input { width: 90px }
.sbseg { display: inline-flex; background: var(--surface2); border-radius: 12px; padding: 3px; gap: 3px } .sbseg button { border: 0; background: transparent; padding: 8px 12px; border-radius: 9px; font: 800 .88rem var(--body); color: var(--ink); cursor: pointer } .sbseg button.sel { background: var(--accent); color: var(--accent-ink, #fff); box-shadow: 0 1px 3px rgba(0, 0, 0, .15) }

.ttout .ic { width: 40px; height: 40px; color: var(--accent); stroke-width: 1.7 } .ttout b { font: 800 1.05rem var(--body) } .ttout span { font: 700 .8rem/1.2 var(--body); color: var(--muted) }

.fqlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 6px } .fqstu { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 10px; background: var(--surface2); font-size: .9rem; opacity: .6 } .fqstu.on { opacity: 1; box-shadow: inset 4px 0 0 var(--good) }

.bday { position: fixed; inset: 0; z-index: 9000; display: grid; place-items: center; padding: 16px; background: rgba(10, 12, 30, .35); animation: bdin .3s ease } .bday.going { background: transparent; pointer-events: none }

.pill.good { background: var(--good-soft); color: var(--good) } .pill.bad { background: var(--bad-soft); color: var(--bad) }
.seg { display: flex; background: var(--surface2); border-radius: 14px; padding: 4px; gap: 4px }

.fdstat { background: var(--surface2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 2px } .fdstat b { font-size: 1.25rem }

.bar { height: 12px; background: var(--surface2); border-radius: 999px; overflow: hidden; display: flex }

.bar.multi i { border-radius: 0 } .bar .m { background: var(--st-mast) } .bar .f { background: var(--st-fam) } .bar .l { background: var(--st-learn) }
input[type=text], input[type=search], input[type=number], select { width: 100%; min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); font-weight: 700 }

/* avatars */

  background: hsl(var(--h) 85% 62%); color: #1B1E3C; font: 700 1.3rem var(--display) }

/* chrome */
#top { display: flex; align-items: center; gap: 10px; padding-bottom: 12px }

#tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); z-index: 20 }

.banner { background: var(--sun); color: var(--sun-ink); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: .875rem; margin-bottom: 12px }

/* home */
.hero { display: flex; gap: 16px; align-items: center }
.hero .grow { display: flex; flex-direction: column; gap: 8px }
.today { display: flex; flex-direction: column; gap: 12px }
.even { grid-template-columns: repeat(var(--cn, 2), minmax(0, 1fr)) !important }
@media (min-width: 640px) { .even { grid-template-columns: repeat(var(--cw, 3), minmax(0, 1fr)) !important } }
.game .em.fsart { position: relative; display: block; flex: none; width: 100%; overflow: hidden; aspect-ratio: 16 / 10; border-radius: 12px; margin-bottom: 4px; background: radial-gradient(circle at 50% 48%, #fff 0 28%, color-mix(in srgb, var(--fc) 22%, #fff) 75%); box-shadow: inset 0 -5px 0 var(--fc) }

.game.feature .em.fsart { width: clamp(110px, 22%, 170px) } .hdoor .em.dpic img, .game .em.fsart img { background: none !important; border-radius: 0 !important; box-shadow: none !important }

.hdoor .em.dpic img { width: clamp(64px, 9vw, 96px); height: clamp(64px, 9vw, 96px); object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0,0,0,.25)) }
.fsart .gbadge { position: absolute; right: 6px; top: 6px; width: 26px; height: 26px; border-radius: 50%; background: #fff; display: grid; place-items: center; font-size: 13px; line-height: 1; box-shadow: 0 0 0 2px var(--fc), 0 2px 5px rgba(0, 0, 0, .2) }
.utitle { font-weight: 800; margin-left: 8px } .utitle::before { content: '· '; color: var(--muted); font-weight: 400 } .stitle { margin-left: 5px; font-weight: 600; opacity: .85 }
.qreport { text-align: center; margin: 6px 0 0 } .qreport .link { font-size: .82rem; color: var(--muted) }
.lhealth { position: fixed; left: 12px; bottom: 12px; z-index: 60; background: rgba(20,20,30,.88); color: #ffd36a; border: 1px solid #ffd36a; border-radius: 999px; padding: 6px 14px; font: 700 .9rem var(--body, inherit); box-shadow: 0 4px 14px rgba(0,0,0,.4) }
.sign { position: relative } .sign .replay { position: absolute; right: 6px; bottom: 6px; z-index: 4; background: rgba(15,15,30,.72); color: #fff; border-radius: 999px; font: 700 12px var(--body, inherit); padding: 4px 9px; cursor: pointer; line-height: 1; user-select: none } .sign .replay:hover { background: rgba(15,15,30,.92) } .sign.none .replay, .sign.missing .replay { display: none }
.hdoors { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px }
.hdoors.brick { grid-template-columns: repeat(6, minmax(0, 1fr)) } .hdoors.brick > .hdoor { grid-column: span 2 } .hdoors.brick > .hdoor:nth-child(4) { grid-column: 2 / span 2 } .hdoors.brick > .hdoor:nth-child(5) { grid-column: 4 / span 2 }      /* 4.122 a brick wall: 3 on top, 2 below in the gaps */

.hdoor { background: var(--surface); border: 0; border-radius: 20px; box-shadow: var(--shadow); padding: 18px 14px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-height: 140px; cursor: pointer }
.hdoor .em { font-size: 2.4rem; line-height: 1 } .hdoor b { font: 700 1.2rem var(--display); color: var(--ink) } .hdoor span:last-child { font-size: .82rem; color: var(--muted); line-height: 1.3 }

.games { display: grid; grid-template-columns: repeat(var(--cn, 2), minmax(0, 1fr)); gap: 12px }

.game { text-align: left; background: var(--surface); border: 0; border-radius: 18px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-height: 112px }
.game .em { font-size: 1.6rem; line-height: 1 } .game b { font: 600 1.05rem var(--display); color: var(--ink) } .game span { font-size: .82rem; color: var(--muted); line-height: 1.3 }

.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; font-weight: 700; color: var(--muted) }

.legend .m { background: var(--st-mast) } .legend .f { background: var(--st-fam) } .legend .l { background: var(--st-learn) }

/* sign media */
.sign { position: relative; display: grid; place-items: center; background: #fff; border-radius: 18px; overflow: hidden; aspect-ratio: 4 / 3; width: 100%; max-width: 100% }
.sign img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain }

.sign.missing img, .sign.none img { display: none } .sign.missing .no, .sign.none .no { display: block }
.sign.big { max-width: 420px; margin: 0 auto; border: 2px solid var(--outline); box-shadow: 0 5px 0 var(--outline) }
.say { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 44px; min-height: 44px; padding: 0 12px; border: 2px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: 700 .95rem var(--body); vertical-align: middle; cursor: pointer; flex: none }
.accbar { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px } .acck { min-width: 40px; min-height: 40px; padding: 0 8px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: 700 1.05rem var(--body); cursor: pointer } .acck.sh.on { background: var(--accent); border-color: var(--accent); color: #fff } .acck.more { font-size: .82rem; margin-left: auto }
.dli { display: flex; align-items: center; gap: 8px }
.dcard { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 14px; padding: 14px 4px; align-items: start } .dterm { display: flex; align-items: center; gap: 8px } .dterm b { font: 600 1.2rem var(--display); overflow-wrap: anywhere }
.ddefc { display: flex; flex-direction: column; gap: 8px; min-width: 0 } .dline { display: flex; align-items: center; gap: 8px } .dline p { margin: 0; overflow-wrap: anywhere } .dpic img { display: block; width: 100%; max-width: 260px; max-height: 200px; object-fit: contain; border-radius: 12px; background: #fff }
@media (max-width: 560px) { .dcard { grid-template-columns: minmax(0, 1fr); gap: 8px } } .dlink { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 0; border: 0; background: none; color: inherit; text-align: left; font: inherit; cursor: pointer }
.say:active { transform: scale(.95) } .sayrow { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap } .saynone { font: 700 .8rem var(--body); color: var(--muted); vertical-align: middle }
h2.prompt .say, h1 .say { font-size: 1rem; margin-left: 6px }
.sign.txt { display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; padding: 10px 12px; color: #1C2340; text-align: center; container-type: inline-size }
.sign.txt .def { font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; font-size: clamp(.8rem, 9cqw, 1.5rem) }
.sign.txt.m .def { font-size: clamp(.75rem, 7cqw, 1.3rem) } .sign.txt.l .def { font-size: clamp(.7rem, 5.6cqw, 1.1rem) } .sign.txt.xl .def { font-size: clamp(.65rem, 4.4cqw, .95rem); line-height: 1.25 }

.sign.txt.big .def { font: 600 clamp(1.35rem, 7cqw, 2.2rem)/1.2 var(--display) } .sign.txt.big.l .def { font-size: clamp(1.15rem, 5cqw, 1.6rem) } .sign.txt.big.xl .def { font: 600 clamp(1rem, 4cqw, 1.25rem)/1.35 var(--body) }
.sign.txt img.tpic { position: static; width: auto; max-width: 100%; height: auto; max-height: 180px; object-fit: contain; border-radius: 10px } .sign.txt.missing img.tpic { display: none }

/* games */
.ghead { display: flex; align-items: center; gap: 12px; margin-bottom: 16px }
.ghead .bar { flex: 1 } .ghead .count { font-weight: 800; min-width: 3.2em; text-align: right }
.ghead .clock { font: 700 1.3rem var(--display); min-width: 2.2em; text-align: right; color: var(--accent) }
.q { display: flex; flex-direction: column; gap: 14px }
.ask { text-align: center; color: var(--muted); font-weight: 800 }
.artnoun { font-size: clamp(2rem, 6vw, 3.2rem); text-align: center } .artopts .opt { font: 700 1.4rem var(--display) }
.prompt { text-align: center; font-size: 1.7rem }

/* kiosk additions */
.knav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

@keyframes khl { 50% { outline-color: #ffe600; } }
.seatfind { position: static !important; padding: 8px !important; }

/* Question of the day results */
.qrq { font-size: 6vmin; line-height: 1.15; text-align: center; margin: 1vh auto 3vh; max-width: 92vw; text-wrap: balance; }
.qrbars { display: grid; gap: 2.2vh; width: 100%; max-width: 1100px; margin: 0 auto; box-sizing: border-box; }
.qrrow { display: grid; grid-template-columns: minmax(0, 1.3fr) 3fr auto; gap: 2vw; align-items: center; font-size: 3.8vmin; font-weight: 800; }
.qrlab { min-width: 0; overflow-wrap: anywhere; }
.qrtrack { height: 6vh; border-radius: 999px; background: var(--surface2); overflow: hidden; }
.qrfill { display: block; height: 100%; width: 0; border-radius: 999px; background: var(--accent); transition: width 1s cubic-bezier(.2, .9, .3, 1.15); }
.qrn { min-width: 3ch; text-align: right; font-variant-numeric: tabular-nums; font-size: 5vmin; }
.qrrow.win .qrfill { background: var(--sun); }
.qrrow.win .qrlab::after { content: " 👑"; }
.qrrow.right .qrfill { background: #2d8a4e; }
.qrrow.right .qrlab::before { content: "✅ "; }
.qrrow.right { transform: scale(1.03); transition: transform .4s; }
.qrrow.wrong { opacity: .45; transition: opacity .6s; }
.qrtalk { max-width: 1000px; margin: 3vh auto 0; padding: 2vh 2.5vw; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow);
  font-size: 3.4vmin; line-height: 1.35; text-align: center; }
.qrtalk[hidden] { display: none; }
.qrbars.drum { animation: qrdrum .11s linear infinite; }
@keyframes qrdrum { 50% { transform: translateX(5px) rotate(.25deg); } }
.qrconf { position: fixed; top: -8vh; z-index: 50; pointer-events: none; animation: qrfall 2.6s ease-in forwards; }
@keyframes qrfall { to { transform: translateY(115vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) { .qrbars.drum, .qrconf { animation: none; } .qrconf { display: none; } .qrfill { transition: none; } }

/* a tool window: just the tool, big */
.ktools .knav, .ktools #view > .stack > .row:first-child { display: none !important; }
.ktool { display: flex; flex-direction: column; gap: 2vh; padding: 2vh 2vw; min-height: 90vh; justify-content: center; }

.kbig.soon { color: var(--bad); }
.kpass { display: grid; grid-template-columns: 1fr auto; gap: 0 2vw; align-items: center; padding: 1.4vh 2vw; margin: 1vh 0;
  border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); font-size: 5vmin; }

/* ===== the teacher view's colors and font (copied from Dashboard.html by dev/build-seating.py) ===== */
  html:root:root {
    --bg: #f3f4f7;
    --panel: #ffffff;
    --ink: #1a2233;
    --muted: #5d6779;
    --line: #dfe3ea;
    --soft: #eef1f6;
    --accent: #2d3a8c;
    --present: #1b7f47;  --present-bg: #e3f4e9;
    --tardy:   #a35a00;  --tardy-bg:   #fdeecd;
    --pass:    #5140b8;  --pass-bg:    #ebe7fb;
    --absent:  #b3261e;  --absent-bg:  #fbe4e1;
    --go: #1b7f47; --go-bg: #e3f4e9;
    --warn: #8a6100; --warn-bg: #fdf0c4;
    --over: #b3261e; --over-bg: #fbe0dc;
    --shadow: 0 1px 2px rgba(20,28,50,.06), 0 6px 18px rgba(20,28,50,.06);
  }
  @media (prefers-color-scheme: dark) {
    html:root:root {
      --bg: #12151c; --panel: #1b202b; --ink: #eef1f7; --muted: #a2abbd;
      --line: #2c3342; --soft: #232937; --accent: #a9b4ff;
      --present: #6fd69a; --present-bg: #17352a;
      --tardy: #f2c063;   --tardy-bg: #3a2e12;
      --pass: #b7abff;    --pass-bg: #2a2550;
      --absent: #ff9a91;  --absent-bg: #3d1e1c;
      --go: #6fd69a; --go-bg: #17352a;
      --warn: #f2c063; --warn-bg: #3a2e12;
      --over: #ff9a91; --over-bg: #3d1e1c;

  /* ---------- color schemes (Colors picker in the header) ---------- */
  html:root:root[data-theme="light"] {
    --bg: #f3f4f7; --panel: #ffffff; --ink: #1a2233; --muted: #5d6779; --line: #dfe3ea; --soft: #eef1f6;
    --accent: #2d3a8c; --present: #1b7f47; --present-bg: #e3f4e9; --tardy: #a35a00; --tardy-bg: #fdeecd;
    --pass: #5140b8; --pass-bg: #ebe7fb; --absent: #b3261e; --absent-bg: #fbe4e1; --go: #1b7f47; --go-bg: #e3f4e9;
    --warn: #8a6100; --warn-bg: #fdf0c4; --over: #b3261e; --over-bg: #fbe0dc;
    --shadow: 0 1px 2px rgba(20,28,50,.06), 0 6px 18px rgba(20,28,50,.06);
  }
  /* Calm classroom: warm paper background, soft pastel colors */
  html:root:root[data-theme="calm"] {
    --bg: #f7f2ea; --panel: #fffdf9; --ink: #2f2a26; --muted: #6f655b; --line: #e8dfd2; --soft: #f3ece2;
    --accent: #2f6f73; --present: #2e7d5b; --present-bg: #dff1e7; --tardy: #b26a1b; --tardy-bg: #fbe9d2;
    --pass: #6b55b0; --pass-bg: #ece6f8; --absent: #c0504d; --absent-bg: #f9e0dd; --go: #2e7d5b; --go-bg: #dff1e7;
    --warn: #9a6a12; --warn-bg: #fbefcf; --over: #c0504d; --over-bg: #f9e0dd;

  /* Night: deep navy with bright, easy-to-read colors */
  html:root:root[data-theme="night"] {
    --bg: #0f172a; --panel: #1e293b; --ink: #f8fafc; --muted: #cbd5e1; --line: #334155; --soft: #273449;
    --accent: #93c5fd; --present: #4ade80; --present-bg: #14532d; --tardy: #fbbf24; --tardy-bg: #4a3410;

  /* High contrast: white, black and strong colors, readable across the room */

ACT.dcfloat = () => {
  if ($('#dcfloat')) return;
  const box = document.createElement('div'); box.id = 'dcfloat'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Dice'); box.innerHTML = dcBox();
  const pos = tmLoad('sh-dc-pos', '').split(','); if (pos.length === 2 && pos[0]) Object.assign(box.style, { left: pos[0], top: pos[1], right: 'auto', bottom: 'auto' });
  document.body.appendChild(box); tmWire(box); dcDrag(box); dcFont(document); dcPaint(); if (typeof ResizeObserver !== 'undefined') new ResizeObserver(() => dcPaint()).observe(box);
  const r = box.getBoundingClientRect(); if (r.left > innerWidth - 40 || r.top > innerHeight - 40) Object.assign(box.style, { left: '', top: '', right: '', bottom: '' });
};
function dcDrag(box) { const head = box.querySelector('[data-drag]');
  head.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; const r = box.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top; head.setPointerCapture(e.pointerId);
    const move = ev => { Object.assign(box.style, { left: Math.max(0, Math.min(innerWidth - r.width, ev.clientX - dx)) + 'px', top: Math.max(0, Math.min(innerHeight - r.height, ev.clientY - dy)) + 'px', right: 'auto', bottom: 'auto' }); };
    const up = () => { head.removeEventListener('pointermove', move); head.removeEventListener('pointerup', up); tmSave('sh-dc-pos', box.style.left + ',' + box.style.top); };
    head.addEventListener('pointermove', move); head.addEventListener('pointerup', up); }); }
ACT.dcpop = async () => {
  let w = null, pip = false;
  try { if (window.documentPictureInPicture) { w = await window.documentPictureInPicture.requestWindow({ width: 380, height: 300 }); pip = true; } } catch (e) { w = null; }
  if (!w) { try { w = window.open('', 'studyhalldice', 'popup=yes,width=400,height=330'); } catch (e) { w = null; } }
  let d = null; try { d = w && w.document; } catch (e) { d = null; }
  if (!d || !d.body) { toast('This browser would not open a separate window, so the dice float on this page instead. Drag them by the top bar.'); return ACT.dcfloat(); }
  d.title = 'Dice'; d.head.innerHTML = ''; d.body.innerHTML = '';
  document.querySelectorAll('style, link[rel="stylesheet"]').forEach(n => d.head.appendChild(d.importNode(n, true)));
  ['style', 'data-theme', 'data-skin', 'data-mode'].forEach(k => { const v = document.documentElement.getAttribute(k); if (v != null) d.documentElement.setAttribute(k, v); });
  const box = d.createElement('div'); box.id = 'dcfloat'; box.className = 'inwin'; box.innerHTML = dcBox(); d.body.appendChild(box);
  const old = $('#dcfloat'); if (old) old.remove();
  S.dcWin = w; tmWire(box); dcFont(d); dcPaint();
  w.addEventListener('resize', () => dcPaint()); w.addEventListener('pagehide', () => { if (S.dcWin === w) S.dcWin = null; });
  w.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); ACT.dcroll(); } });
  if (!pip) toast('The dice are in their own window. Drag it wherever you like.');
};
ACT.dcclose = el => { const box = el.closest('#dcfloat'); if (box && box.classList.contains('inwin')) { try { S.dcWin.close(); } catch (e) {} S.dcWin = null; return; } if (box) box.remove(); };
ACT.dcfull = () => {
  if ($('#dcfull')) return;
  const d = document.createElement('div'); d.id = 'dcfull'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-label', 'Dice, full screen');
  d.innerHTML = dcArea() + '<div class="row" style="justify-content:center;gap:12px"><button class="btn sun dcgo" data-a="dcroll">🎲 Roll</button><button class="btn alt" data-a="dcexit">Exit full screen</button></div>';
  document.body.appendChild(d); tmWire(d); dcRedrawAll();
  try { const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (p && p.catch) p.catch(() => {}); } catch (e) {}
};
ACT.dcexit = () => { const d = $('#dcfull'); if (d) d.remove(); try { if (document.fullscreenElement) document.exitFullscreen(); } catch (e) {} };
addEventListener('resize', () => { if (dcRoots().length) dcPaint(); });
document.addEventListener('fullscreenchange', () => setTimeout(() => dcPaint(), 60));
document.addEventListener('keydown', e => { if (!(e.key === ' ' || (e.key === 'Enter' && $('#dcfull')))) return; if (!$('#dcfull') && S.view !== 'dice') return; const t = e.target; if (t && /^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(t.tagName)) return; e.preventDefault(); ACT.dcroll(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#dcfull')) ACT.dcexit(); });


/* ===== Hall Pass Kiosk: Classroom tools page (?view=tools&tool=…) =====
   Opened by the teacher view's Tools menu in its own small window, to drag onto the projector.
   Timer, Dice and Scoreboard are ASL Study's (above); Random number, Hall pass board and Time left
   are the kiosk's own. Same rules as ASL Study: no slash-star or double-slash comments inside
   template strings or regexes. */
S.set = S.set || {};
S.set.pipArt = 'https:' + '/' + '/colleenelyse.github.io/study-hall-sayit/pip/';      /* where the ASL dice font lives */
S.d = S.d || { units: [] };                                                            /* no word lists in the kiosk */
const item = () => null; const THEMES = {}; const bgOk = {}; const driveImg = () => '';    /* Shop themes: not in the kiosk */
S.shop = S.shop || [];                                                                 /* no Shop items, so the timer stays plain */

ACT.close = closeModal;
document.addEventListener('submit', e => { const f = e.target.closest('[data-f]'); if (!f) return; e.preventDefault(); if (FORM[f.dataset.f]) FORM[f.dataset.f](f); });
document.addEventListener('click', e => {
  if (e.target.id === 'modal') return closeModal();
  const el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.a]; if (fn) fn(el, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) closeModal(); });

/* ----- Random number: a range, an optional "no repeats" ----- */
S.rn = (() => { let v = null; try { v = JSON.parse(tmLoad('k-rn', 'null')); } catch (e) {} return Object.assign({ min: 1, max: 30, norep: true, used: [], last: null }, v || {}); })();
const rnSave = () => tmSave('k-rn', JSON.stringify(S.rn));
VIEW.rnum = () => {
  const R = S.rn, left = Math.max(0, R.max - R.min + 1 - (R.norep ? R.used.length : 0));
  return `<div class="ktool">
    <div class="kbig" id="rnbig">${R.last == null ? '?' : esc(R.last)}</div>
    <div class="row noprint" style="gap:10px;flex-wrap:wrap;justify-content:center;align-items:flex-end">
      <label class="field" style="max-width:110px">From<input id="rnmin" type="number" value="${R.min}"></label>
      <label class="field" style="max-width:110px">To<input id="rnmax" type="number" value="${R.max}"></label>
      <label class="row" style="gap:6px"><input id="rnnorep" type="checkbox"${R.norep ? ' checked' : ''}> No repeats</label>
      <button class="btn sun" data-a="rngo">Pick a number</button>
      <button class="btn ghost" data-a="rnreset">Start over</button>
    </div>
    <p class="small muted" style="text-align:center">${R.norep ? left + ' left to pick' + (R.used.length ? ' · picked: ' + R.used.slice(-12).join(', ') : '') : 'Repeats allowed'}</p>
  </div>`;
};
ACT.rngo = () => {
  const R = S.rn, lo = Math.min(R.min, R.max), hi = Math.max(R.min, R.max);
  let pool = []; for (let n = lo; n <= hi && pool.length < 5000; n++) if (!R.norep || R.used.indexOf(n) < 0) pool.push(n);
  if (!pool.length) return toast('Every number has been picked. Press Start over.');
  const pick = rand(pool), big = $('#rnbig'); let spins = 0;
  const t = setInterval(() => {
    if (big) big.textContent = rand(pool);
    if (++spins >= 12) { clearInterval(t); R.last = pick; if (R.norep) R.used.push(pick); rnSave(); go('rnum'); }
  }, 60);
};
ACT.rnreset = () => { S.rn.used = []; S.rn.last = null; rnSave(); go('rnum'); };
document.addEventListener('change', e => {
  const id = e.target && e.target.id; if (!/^rn(min|max|norep)$/.test(id || '')) return;
  if (id === 'rnnorep') S.rn.norep = e.target.checked; else S.rn[id.slice(2)] = Math.round(Number(e.target.value) || 0);
  S.rn.used = []; S.rn.last = null; rnSave(); go('rnum');
});

/* ----- Hall pass board: who is out (where, how long) and who is next in line ----- */
S.pb = { passes: [], line: [], at: 0 };
const pbClock = ms => { const s = Math.max(0, Math.floor((Date.now() - ms) / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
VIEW.passboard = () => `<div class="ktool"><h1 style="text-align:center;margin:0">Out of the room</h1><div id="pbbody"></div></div>`;
function pbPaint() {
  const b = $('#pbbody'); if (!b) return;
  b.innerHTML = (S.pb.passes.length ? S.pb.passes.map(p => `<div class="kpass"><b>${esc(p.displayName || p.name)}</b><span>${esc(p.destination)}${p.delivered ? ' (paper pass)' : ''}</span><i data-out="${p.timeOutMs}">${pbClock(p.timeOutMs)}</i></div>`).join('')
      : '<p class="kbig" style="font-size:9vmin">Everyone is here 🎉</p>') +
    (S.pb.line.length ? `<div class="kline">🙋 Next in line: ${S.pb.line.map(e => esc(e.displayName || e.name)).join(', ')}</div>` : '');
}
function pbLoad() {
  call('getKioskPoll', { passes: true, queue: true }).then(r => { S.pb.passes = r.passes || []; S.pb.line = r.queue || []; pbPaint(); }).catch(() => {});
}

/* ----- Time left in class: a big countdown to the end of the period ----- */
S.tl = { status: null };
VIEW.timeleft = () => `<div class="ktool"><p class="eyebrow" id="tllabel" style="text-align:center;font-size:3vmin"></p><div class="kbig" id="tlbig">…</div><p class="muted" id="tlsub" style="text-align:center"></p></div>`;
const tlMinutes = t => { const m = String(t || '').trim().match(/^(\d{1,2}):(\d{2})\s*([AaPp])?/); if (!m) return null; let h = +m[1]; if (m[3]) { const pm = m[3].toLowerCase() === 'p'; if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12; } return h * 60 + (+m[2]); };
function tlPaint() {
  const s = S.tl.status || {}, end = tlMinutes(s.classEnds), big = $('#tlbig'); if (!big) return;
  if (end == null) { big.textContent = '—'; $('#tllabel').textContent = s.label || 'No class right now'; $('#tlsub').textContent = ''; return; }
  const d = new Date(), now = d.getHours() * 3600 + d.getMinutes() * 60 + d.getSeconds(), left = Math.max(0, end * 60 - now);
  big.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  $('#tllabel').textContent = (s.period ? s.period + ' period' : s.label || '') + ' ends at ' + s.classEnds;
  $('#tlsub').textContent = left <= 300 && left > 0 ? 'Almost time — clean up and get ready to go.' : '';
  big.classList.toggle('soon', left <= 300);
}
function tlLoad() { call('getBellScheduleStatus', '__AUTO__').then(st => { S.tl.status = st; tlPaint(); }).catch(() => {}); }

/* ----- Question of the day results: the teacher reveals the class's answers (anonymous counts) ----- */
S.qr = { cls: '', data: null, shown: false, answered: false };
/* Two kinds (2026-10-20): Class Poll (votes, the winner gets a crown) and Countdown to Adulting (votes first, then the right answer turns green with the
   teacher's talking point). */
VIEW.qresults = () => `<div class="ktool qr"><p class="eyebrow" id="qrkind" style="text-align:center;font-size:2.6vmin">❓ Question of the day</p>
  <h1 class="qrq" id="qrq">…</h1><div class="qrbars" id="qrbars"></div>
  <div class="qrtalk" id="qrtalk" hidden></div>
  <div class="row noprint" style="justify-content:center;gap:10px;margin-top:3vh"><button class="btn sun" data-a="qrreveal" id="qrgo">🥁 Reveal the answers</button><button class="btn sun" data-a="qranswer" id="qrans" hidden>✅ Reveal the right answer</button><button class="btn ghost" data-a="qrload">↻ Refresh</button></div>
  <p class="muted" id="qrnote" style="text-align:center"></p></div>`;
const qrKnow = () => !!(S.qr.data && S.qr.data.kind === 'know' && S.qr.data.correct >= 0);
function qrPaint() {
  const d = S.qr.data, box = $('#qrbars'); if (!d || !box) return;
  $('#qrq').textContent = d.question;
  $('#qrkind').textContent = qrKnow() ? '⏳ Countdown to Adulting' : d.kind === 'poll' ? '🗳️ Class Poll' : '❓ Question of the day';
  $('#qrgo').textContent = qrKnow() ? '🥁 Reveal the votes' : '🥁 Reveal the answers';
  box.innerHTML = d.choices.map((c, i) => `<div class="qrrow" data-i="${i}"><span class="qrlab">${esc(c)}</span><span class="qrtrack"><i class="qrfill"></i></span><b class="qrn">?</b></div>`).join('');
  $('#qrnote').textContent = d.total ? d.total + (d.total === 1 ? ' answer so far' : ' answers so far') : 'No answers yet. Students answer when they check in.';
  if (S.qr.shown) qrShow(false);
  if (S.qr.answered) qrAnswer(false);
}
function qrShow(slow) {
  const d = S.qr.data, max = Math.max(1, ...d.counts), top = Math.max(...d.counts);
  document.querySelectorAll('.qrrow').forEach((row, k) => {
    const i = +row.dataset.i;
    setTimeout(() => {
      row.querySelector('.qrfill').style.width = (100 * d.counts[i] / max) + '%';
      row.querySelector('.qrn').textContent = d.counts[i];
      if (!qrKnow() && top > 0 && d.counts[i] === top) row.classList.add('win');
    }, slow ? 500 * k : 0);
  });
  if (qrKnow()) { $('#qrans').hidden = S.qr.answered; return; }
  if (slow && top > 0) setTimeout(qrConfetti, 500 * d.choices.length + 400);
}
function qrAnswer(slow) {
  const d = S.qr.data; if (!qrKnow()) return;
  document.querySelectorAll('.qrrow').forEach(row => row.classList.toggle('right', +row.dataset.i === d.correct));
  document.querySelectorAll('.qrrow:not(.right)').forEach(row => row.classList.add('wrong'));
  const t = $('#qrtalk'); t.textContent = d.talk ? '💬 ' + d.talk : ''; t.hidden = !d.talk;
  $('#qrans').hidden = true;
  if (slow) qrConfetti();
}
ACT.qranswer = () => {
  if (!qrKnow()) return;
  const box = $('#qrbars'); box.classList.add('drum'); $('#qrans').disabled = true;
  setTimeout(() => { box.classList.remove('drum'); S.qr.answered = true; qrAnswer(true); $('#qrans').disabled = false; }, 1600);
};
function qrConfetti() {
  for (let n = 0; n < 36; n++) {
    const e = document.createElement('span'); e.className = 'qrconf'; e.textContent = ['🎉', '🎊', '✨', '🤟'][n % 4];
    e.style.left = Math.random() * 100 + 'vw'; e.style.animationDelay = (Math.random() * 0.6) + 's'; e.style.fontSize = (3 + Math.random() * 3) + 'vmin';
    document.body.appendChild(e); setTimeout(() => e.remove(), 3200);
  }
}
ACT.qrreveal = () => {
  if (!S.qr.data) return;
  const box = $('#qrbars'); box.classList.add('drum');
  $('#qrgo').disabled = true;
  setTimeout(() => { box.classList.remove('drum'); S.qr.shown = true; qrShow(true); $('#qrgo').disabled = false; }, 1600);
};
function qrLoad() { call('getArrivalResults', { classKey: S.qr.cls }).then(d => { S.qr.data = d; qrPaint(); }).catch(e => toast(e.message)); }
ACT.qrload = () => qrLoad();

/* ----- which tool this window shows ----- */
const KTOOLS = { timer: 'tmfull' };      /* the Timer opens straight into its big view; Dice (Colleen, 2026-10-17) and the Scoreboard open on their settings */
(function start() {
  const begin = p => {
    const tool = String(p.tool || 'timer');
    document.title = { timer: 'Timer', dice: 'Dice', score: 'Scoreboard', rnum: 'Random number', passboard: 'Hall pass board', timeleft: 'Time left', qresults: 'Question of the day' }[tool] || 'Classroom tools';
    document.body.classList.add('ktools');
    if (!VIEW[tool]) return go('timer');
    go(tool);
    if (KTOOLS[tool] && ACT[KTOOLS[tool]]) setTimeout(() => { try { ACT[KTOOLS[tool]]($('[data-a="' + KTOOLS[tool] + '"]') || document.body); } catch (e) {} }, 300);
    if (tool === 'passboard') { pbLoad(); setInterval(pbLoad, 10000); setInterval(() => document.querySelectorAll('[data-out]').forEach(i => { i.textContent = pbClock(+i.dataset.out); }), 1000); }
    if (tool === 'timeleft') { tlLoad(); setInterval(tlLoad, 60000); setInterval(tlPaint, 1000); }
    if (tool === 'qresults') { S.qr.cls = String(p.cls || ''); qrLoad(); }
  };
  try { google.script.url.getLocation(loc => begin((loc && loc.parameter) || {})); }
  catch (e) { begin({}); }
})();

(function () {
  var root = document.documentElement, sel = document.getElementById('kTheme'), pop = document.getElementById('kPop'), PAGE = 'tools';
  sel.value = root.getAttribute('data-kiosk-theme') || root.getAttribute('data-theme') || 'auto';
  setTimeout(function () { var t = root.getAttribute('data-theme'); if (t && !root.getAttribute('data-kiosk-theme')) sel.value = t; }, 1500);
  sel.onchange = function () {
    var v = sel.value; if (v === 'auto') root.removeAttribute('data-theme'); else root.setAttribute('data-theme', v);
    root.setAttribute('data-kiosk-theme', v);
    try { localStorage.setItem('teacherViewTheme', v); } catch (e) {}
    try { google.script.run.setKioskTheme(v); } catch (e) {}
  };
  pop.onclick = function () {
    var base = root.getAttribute('data-kiosk-url') || (typeof kioskLink !== 'undefined' ? kioskLink : '');
    if (!base) { alert('The page is still loading. Try again in a moment.'); return; }
    var v = (typeof S !== 'undefined' && S.view) || '', q;
    if (PAGE === 'seating') q = v === 'picker' || v === 'groups' ? '?view=seating&tool=' + v : '?view=seating';
    else q = '?view=tools&tool=' + (v || 'timer');
    var small = /^(timer|dice|rnum|timeleft|picker)$/.test(v), w = small ? 620 : 1100, h = small ? 520 : 760;
    var win = window.open(base + q, 'kpop' + Date.now(), 'popup=yes,width=' + w + ',height=' + h);
    if (!win) alert('The pop-out window was blocked. Allow pop-ups for this page (the icon at the right end of the address bar), then press Pop out again.');
  };
})();

</script>
