# Keeps the github.io copy's passwords in step with asl.cool (Colleen: a backup address for schools that block asl.cool).
# Every hour it copies asl.cool/lock.json (encrypted lists only) into index.html; commits only when something changed.
name: Sync passwords from asl.cool
on:
  schedule: [{ cron: '17 * * * *' }]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the encrypted lists
        run: |
          curl -sf https://asl.cool/lock.json -o /tmp/lock.json
          python3 - <<'PY'
          import json, re
          d = json.load(open('/tmp/lock.json'))
          assert d.get('lock', {}).get('data') and isinstance(d.get('slocks'), list)
          s = open('index.html').read()
          s2 = re.sub(r'(/\*LOCK\*/).*?(/\*END LOCK\*/)', lambda m: m.group(1) + json.dumps(d['lock'], separators=(',', ':')) + m.group(2), s, count=1)
          s2 = re.sub(r'(/\*SLOCKS\*/).*?(/\*END SLOCKS\*/)', lambda m: m.group(1) + json.dumps(d['slocks'], separators=(',', ':')) + m.group(2), s2, count=1)
          open('index.html', 'w').write(s2)
          PY
      - name: Commit if changed
        run: |
          git diff --quiet && exit 0
          git config user.name "asl-cool-sync"; git config user.email "actions@users.noreply.github.com"
          git commit -am "Sync passwords from asl.cool" && git push
